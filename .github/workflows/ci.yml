name: CI

on:
  push:
    branches: [main]
    # A version tag (LOOM-129): v + SemVer 2.0.0, on a main commit.
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

      # The tested bundle goes to the publish job, on main only.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # LOOM-125: no known-vulnerable npm package, at any severity. Dev
  # dependencies count: the bundle we ship is built with them. Needs no
  # install (it reads package-lock.json) and runs no package code. A
  # finding with no fix yet is triaged in docs/release.md.
  # Changelog fragments (changes/*.md) are well-formed.
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/changelog.sh check

  # The e2e suite (e2e/README.md): this build in a real browser against the
  # published loomux/server image, with a stand-in router model and agent
  # CLI, on a throwaway database. No credentials: the password is made up
  # per run. It doesn't gate publish yet; it's the safety net for the web
  # redesign.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=low

  # LOOM-58: every tested main commit is published as a pre-release
  # `web-<short sha>` holding the built bundle and web-release.json,
  # which names the commit and the tarball's sha256. loomux/server's
  # image build downloads the release its deploy/web-ref pins instead
  # of building this repo itself; LOOM-118's updater reads the same
  # JSON. See docs/release.md. Its own job, so only this one, which runs
  # no npm code, holds a token that can write the repository.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # The bundle's build-provenance attestation (LOOM-118 option b).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version tags, to continue the release line.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # LOOM-129: after the base v0.1.0, every merge to main is the next
      # patch version, reserved first: the tag is created on the merge
      # commit through the API, which refuses one that exists, so racing
      # merges each get their own (no concurrency group, so no run is ever
      # cancelled). A commit that already has a version keeps it. v* tags
      # are immutable (ruleset), so a run that fails after reserving burns
      # the number: a re-run reuses it, otherwise the next merge takes the
      # next one. SemVer allows the gap; no version is reused.
      - name: Reserve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          had="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          version="$(scripts/release.sh reserve "${GITHUB_SHA}" patch)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "${version}" ] && [ -z "${had}" ]; then echo "reserved=true" >> "$GITHUB_OUTPUT"; fi

      - name: Publish the bundle as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          short="${sha:0:7}"
          tag="web-${short}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            exit 0
          fi
          test -f dist/index.html
          tarball="loomux-web-${short}.tar.gz"
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner -czf "${tarball}" .
          jq -n \
            --arg commit "${sha}" --arg short "${short}" --arg tag "${tag}" \
            --arg tarball "${tarball}" \
            --arg sha256 "$(sha256sum "${tarball}" | cut -d' ' -f1)" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg subject "$(git log -1 --format=%s)" \
            '{schema: 1, repo: "loomux/web", commit: $commit, short: $short, tag: $tag,
              tarball: $tarball, sha256: $sha256, built_at: $built_at, subject: $subject}' \
            > web-release.json
          cat web-release.json
          gh release create "${tag}" "${tarball}" web-release.json \
            --target "${sha}" --prerelease \
            --title "web ${short}" \
            --notes "Built from ${sha}: $(git log -1 --format=%s)"
          {
            echo "### Published \`${tag}\`"
            echo ""
            echo "\`${tarball}\` sha256 \`$(jq -r .sha256 web-release.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # LOOM-118 option b: a signed SLSA build-provenance attestation for
      # the tarball, issued to this workflow on refs/heads/main. loomuxd's
      # web updater installs a release only if one verifies: its digest is
      # the tarball's and its source commit the release's.
      - name: Attest the bundle
        if: hashFiles('loomux-web-*.tar.gz') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: loomux-web-*.tar.gz

      - name: Release the version
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "v${VERSION} is already released."; exit 0; fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[] | "- \(.title) (#\(.number))"' > notes.md
          [ -s notes.md ] || git log -1 --format='- %s' > notes.md
          printf '\nThe bundle is release `web-%s`.\n' "${GITHUB_SHA:0:7}" >> notes.md
          pre=""
          if scripts/release.sh prerelease "${VERSION}"; then pre="--prerelease"; fi
          gh release create "v${VERSION}" --verify-tag ${pre} --latest=false \
            --title "Loomux web ${VERSION}" --notes-file notes.md
          echo "### Released \`v${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  # A hand-pushed version tag's GitHub release (LOOM-129): the base v0.1.0,
  # a MINOR milestone, an -rc. The bundle itself is the tagged commit's
  # web-<sha> pre-release, which loomux/server pins; this names it and
  # carries the version's CHANGELOG section. 0.y.z and -pre
  # versions are pre-releases, and nothing here marks a release "latest".
  version-release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(scripts/release.sh version "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }
          scripts/release.sh notes "${version}" > notes.md
          printf '\nThe bundle is release `web-%s`.\n' "$(git rev-parse --short=7 HEAD)" >> notes.md
          pre=""
          if scripts/release.sh prerelease "${version}"; then pre="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag ${pre} --latest=false \
            --title "Loomux web ${version}" --notes-file notes.md

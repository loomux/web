<title>Loomux Shuttle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap">
<style>
/* Shuttle: Loomux as a messenger for your agents.
   Phone: one column + bottom bar. Desktop: rail | queue or thread | context.
   The one bold thing: the needs-you answer cards (marigold band ending in a woven hatch). */
:root{
  --ground:#E9EEF3; --surface:#FFFFFF; --surface-2:#F4F7FA; --sunken:#DFE6ED;
  --ink:#14202C; --ink-2:#465668; --ink-3:#6A7A8C; --line:#D2DBE4;
  --accent:#0B7A85; --accent-hover:#08646D; --accent-ink:#FFFFFF; --accent-soft:#DCEFF0;
  --mari:#EFA10C; --mari-2:#F8C75A; --mari-soft:#FFF3D8; --mari-ink:#5A3A00; --mari-on:#281A00;
  --bad:#BC372D; --bad-soft:#FBE7E4; --good:#2B7849; --good-soft:#E1F1E7;
  --pane:#0E1A26; --pane-ink:#C8DDE5; --pane-dim:#6D899A; --pane-hi:#F8C75A;
  --proto:#6A4ED6; --proto-soft:#EEEAFD; --chrome:#DAE2EA; --chrome-ink:#24303C; --device:#1B2531;
  --focus:#0B7A85; --scrim:rgba(14,22,32,.42);
  --shadow:0 1px 2px rgba(20,32,44,.06),0 10px 28px rgba(20,32,44,.09);
  --f-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0C1426; --surface:#132036; --surface-2:#17263E; --sunken:#0A1120;
  --ink:#E4EBF5; --ink-2:#A2B1C5; --ink-3:#7C8CA2; --line:#24344F;
  --accent:#43BAC5; --accent-hover:#62CBD4; --accent-ink:#03272B; --accent-soft:#0F313A;
  --mari:#F5B23A; --mari-2:#FFD27C; --mari-soft:#32260C; --mari-ink:#FFE1A6; --mari-on:#281A00;
  --bad:#FF8075; --bad-soft:#3A1815; --good:#6CCF95; --good-soft:#102F1E;
  --pane:#060B15; --pane-ink:#BED4DD; --pane-dim:#5C7284; --pane-hi:#FFD27C;
  --proto:#A897FF; --proto-soft:#221C45; --chrome:#08101E; --chrome-ink:#D5DEEA; --device:#02060D;
  --focus:#62CBD4; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0C1426; --surface:#132036; --surface-2:#17263E; --sunken:#0A1120;
  --ink:#E4EBF5; --ink-2:#A2B1C5; --ink-3:#7C8CA2; --line:#24344F;
  --accent:#43BAC5; --accent-hover:#62CBD4; --accent-ink:#03272B; --accent-soft:#0F313A;
  --mari:#F5B23A; --mari-2:#FFD27C; --mari-soft:#32260C; --mari-ink:#FFE1A6; --mari-on:#281A00;
  --bad:#FF8075; --bad-soft:#3A1815; --good:#6CCF95; --good-soft:#102F1E;
  --pane:#060B15; --pane-ink:#BED4DD; --pane-dim:#5C7284; --pane-hi:#FFD27C;
  --proto:#A897FF; --proto-soft:#221C45; --chrome:#08101E; --chrome-ink:#D5DEEA; --device:#02060D;
  --focus:#62CBD4; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--chrome);color:var(--chrome-ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;padding:0 16px 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype toolbar (not part of the design) ---------- */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 0;background:var(--chrome);border-bottom:1px solid var(--line);margin-bottom:20px}
.proto-name{font-weight:800;font-size:15px;margin-right:auto;display:flex;gap:8px;align-items:center}
.proto-name small{font-weight:400;color:var(--ink-3)}
.pgroup{display:flex;align-items:center;gap:6px;min-width:0}
.pgroup>span{font-size:12px;color:var(--ink-3)}
.pseg{display:flex;background:var(--sunken);border-radius:9px;padding:2px;overflow-x:auto;max-width:100%}
.pseg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.pseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{border:1.5px dashed var(--proto);background:var(--proto-soft);color:var(--proto);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.note b{font-weight:700}

/* ---------- stage ---------- */
.stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.desk-slot{flex:1 1 640px;min-width:0}
.phone-slot{flex:0 0 auto;max-width:100%}
.slot-cap{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.desk-vp,.phone-vp{position:relative;overflow:hidden}
.desk{width:1280px;height:820px;transform-origin:top left;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;background:var(--ground)}
.winbar{height:32px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--sunken);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.winbar i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.winbar span{margin-left:14px;background:var(--surface);padding:2px 12px;border-radius:6px}
.phone{width:410px;height:864px;transform-origin:top left;border:10px solid var(--device);border-radius:46px;overflow:hidden;box-shadow:var(--shadow);background:var(--ground)}

/* ---------- app ---------- */
.app{background:var(--ground);color:var(--ink);font-family:var(--f-ui);position:relative;overflow:hidden;display:flex;flex-direction:column;height:100%;min-height:0}
.desk .app{flex:1}
.app h1,.app h2,.app h3{text-wrap:balance;margin:0}
.app p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}
.sb{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12.5px;font-weight:700;color:var(--ink)}
.scroll{overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid transparent;padding:0 16px;min-height:40px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--surface-2);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:transparent}
.btn-approve{background:var(--accent);color:var(--accent-ink)}
.btn-approve:hover{background:var(--accent-hover);border-color:transparent}
.btn-deny{background:transparent;border-color:var(--ink-3);color:var(--ink)}
.btn-deny:hover{border-color:var(--ink)}
.btn-danger{background:var(--bad);color:var(--surface)}
.btn-quiet{background:transparent;color:var(--accent);padding:0 8px}
.btn-quiet:hover{border-color:transparent;text-decoration:underline}
.btn-sm{min-height:32px;font-size:13.5px;padding:0 12px;border-radius:9px}
.is-p .btn{min-height:44px}
.is-p .btn-sm{min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--mari);color:var(--mari-on);font-size:12.5px;font-weight:800}

/* status shapes */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.st svg{width:14px;height:14px;flex:none}
.st-approval,.st-asking,.st-waiting{color:var(--mari-ink)}
.st-approval svg,.st-asking svg,.st-waiting svg{color:var(--mari)}
.st-working{color:var(--accent)}
.st-done{color:var(--good)}
.st-failed{color:var(--bad)}
.st-idle,.st-archived{color:var(--ink-2)}
.st-active{color:var(--accent)}
.st-broken{color:var(--bad)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- answer cards: the bold thing ---------- */
.ask{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.ask-band{display:flex;align-items:center;gap:8px;padding:9px 84px 9px 16px;min-height:40px;font-weight:800;font-size:14px;color:var(--mari-on);
  background:linear-gradient(90deg,var(--mari) 0,var(--mari) calc(100% - 76px),transparent calc(100% - 76px)),repeating-linear-gradient(135deg,var(--mari) 0 7px,var(--mari-2) 7px 14px);position:relative}
.ask-band svg{width:16px;height:16px}
.ask-band .right{margin-left:auto;font-weight:700;font-size:13px}
.ask-band.bad{background:var(--bad-soft);color:var(--bad);padding-right:16px}
.ask-body{padding:16px 18px 18px;display:grid;gap:12px}
.ask h3{font-size:19px;line-height:1.25;font-weight:800}
.ask .ctx{font-size:13.5px;color:var(--ink-2)}
.ask .ctx a,.linkish{color:var(--accent);font-weight:700;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}
.cmd{background:var(--pane);color:var(--pane-ink);font-family:var(--f-mono);font-size:13.5px;border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin:0;line-height:1.5}
.cmd .p{color:var(--pane-dim);user-select:none}
.ask-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.is-p .ask-actions .btn{min-height:52px;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;min-height:48px;cursor:pointer;font-weight:700}
.opt:hover{border-color:var(--accent)}
.opt b{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none;font-size:13px}
.opt small{display:block;font-weight:400;color:var(--ink-2)}
.replyrow{display:flex;gap:8px}
.replyrow input{flex:1;min-width:0}
.resolved{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.resolved svg{width:18px;height:18px;flex:none;margin-top:1px}
.resolved.ok svg{color:var(--good)} .resolved.no svg{color:var(--ink-3)}
details.raw summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:700}
details.raw pre{margin:8px 0 0}

/* inputs */
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:13.5px;font-weight:700}
.field small{color:var(--ink-3);font-size:12.5px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.is-p .inp{min-height:46px;font-size:16px}
.err{color:var(--bad);font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:flex-start}
.err svg{width:16px;height:16px;flex:none;margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}

/* lists */
.sec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:4px 2px 0}
.sec-h .faint{font-weight:500}
.rows{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-height:56px;cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{font-size:13px;color:var(--ink-3);white-space:nowrap}
.fold{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 2px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);min-height:44px}
.fold svg{width:18px;height:18px;transition:transform .15s}
.fold[aria-expanded="true"] svg{transform:rotate(90deg)}

/* glyphs */
.gl{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.gl svg{width:20px;height:20px}
.gl-router{background:var(--ink);color:var(--ground)}
.gl-cc{background:var(--accent-soft);color:var(--accent)}
.gl-cmd{background:var(--sunken);color:var(--ink-2)}
.gl-sm{width:26px;height:26px;border-radius:8px;font-size:11px}
.gl-sm svg{width:15px;height:15px}

/* phone chrome */
.p-head{display:flex;align-items:center;gap:8px;padding:6px 12px 10px 18px;flex:none}
.p-head h1{font-size:26px;font-weight:800;letter-spacing:-.01em;flex:1}
.p-head .sub{font-size:13px;color:var(--ink-2)}
.p-body{padding:4px 14px 20px;display:grid;gap:14px;align-content:start}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 6px 14px}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;font-weight:700;color:var(--ink-3);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .tpill{background:var(--accent-soft)}
.tpill{display:grid;place-items:center;width:56px;height:30px;border-radius:15px}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;font-size:11.5px}
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0}
.sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px 24px;max-height:88%;overflow-y:auto;display:grid;gap:14px;animation:up .2s ease-out}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:0}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet h2{font-size:20px;font-weight:800}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.menu{display:grid}
.menu button{display:flex;gap:14px;align-items:center;border:0;background:none;padding:0 4px;min-height:52px;font-weight:700;font-size:16px;cursor:pointer;border-top:1px solid var(--line);text-align:left}
.menu button:first-child{border-top:0}
.menu svg{width:22px;height:22px;color:var(--ink-2)}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;white-space:nowrap;box-shadow:var(--shadow)}
.is-d .toast{bottom:28px}

/* desktop chrome */
.d-shell{display:grid;grid-template-columns:216px 1fr;height:100%;min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 8px 14px}
.brand .gl{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:10px;padding:0 10px;min-height:40px;font-weight:700;cursor:pointer;color:var(--ink-2);text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto}
.rail .recent{margin-top:14px;display:grid;gap:2px;overflow:hidden}
.rail .recent h2{font-size:12.5px;font-weight:700;color:var(--ink-3);padding:0 10px 4px}
.rail .recent button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left;color:var(--ink-2);min-width:0}
.rail .recent button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .recent button:hover{background:var(--surface-2);color:var(--ink)}
.rail .recent svg{width:12px;height:12px;flex:none}
.rail .grow{flex:1}
.d-main{display:grid;min-height:0;min-width:0}
.col{min-height:0;min-width:0;display:flex;flex-direction:column}
.col-head{padding:22px 28px 14px;display:flex;align-items:center;gap:12px;flex:none}
.col-head h1{font-size:24px;font-weight:800;flex:1}
.col-body{padding:0 28px 28px;display:grid;gap:16px;align-content:start}
.side{background:var(--surface-2);border-left:1px solid var(--line)}

/* thread */
.thread{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;padding:18px 16px 24px}
.thread>*{min-width:0}
.is-d .thread{padding:22px 32px 28px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg .who{font-size:12.5px;color:var(--ink-3);margin-bottom:4px;display:flex;gap:8px}
.msg .who b{color:var(--ink-2)}
.msg .body{min-width:0;flex:1}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:15px;line-height:1.55;min-width:0}
.bubble p+p,.bubble p+pre,.bubble pre+p{margin-top:8px}
.bubble code{font-family:var(--f-mono);font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:5px}
.bubble pre{background:var(--pane);color:var(--pane-ink);border-radius:10px;padding:10px 12px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;margin:0;line-height:1.5}
.bubble pre code{background:none;padding:0;color:inherit}
.tok-k{color:#8FD3F2}.tok-s{color:#F8C75A}.tok-n{color:#B7E3A1}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:16px 4px 16px 16px;max-width:82%}
.msg.me .body{flex:0 1 auto;display:grid;justify-items:end;max-width:86%}
.msg.me.queued .bubble{background:transparent;color:var(--ink);border:1.5px dashed var(--accent)}
.sys{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;padding-left:44px}
.sys svg{width:15px;height:15px;color:var(--ink-3)}
.cmdres .bubble{padding:0;overflow:hidden}
.cmdres .cap{padding:9px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.cmdres .cap .exit{margin-left:auto;font-family:var(--f-mono);font-weight:700;color:var(--good)}
.cmdres pre{border-radius:0}
.turn{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.turn-top{display:flex;align-items:center;gap:10px;font-weight:800}
.turn-top .el{margin-left:auto;font-weight:700;color:var(--ink-2)}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stages li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-3)}
.stages li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
.stages li.done{color:var(--ink-2)} .stages li.done i{background:var(--ink-3);border-color:var(--ink-3)}

function needsCount(){

// ---------- the turn engine (conversation) ----------
const STAGES = {
  offer:["Queued","Deciding where this goes…","claude-code is working in ledger-api"],
  plain:["Queued","Deciding where this goes…","Loomux is answering…"],
};
let turnSeq = 0, paneTimer = null;
function startTurn(kind){
  const id = ++turnSeq;
  S.conv.turn = {id, kind, stage:0, since:Date.now()};
  S.pane = [];
  render();
  const live = () => S.conv.turn && S.conv.turn.id === id;
  setTimeout(() => { if(live()){ S.conv.turn.stage = 1; render(); } }, 900);
  setTimeout(() => {
    if(!live()) return;
    S.conv.turn.stage = 2; render();
    if(kind === "offer"){
      let n = 0;
      clearInterval(paneTimer);
      paneTimer = setInterval(() => {
        if(!live()){ clearInterval(paneTimer); return; }
        S.pane.push(PANE_LIVE[n++]); paintPane();
        if(n >= PANE_LIVE.length){ clearInterval(paneTimer); setTimeout(() => live() && finishTurn(), 1400); }
      }, 1200);
    } else setTimeout(() => live() && finishTurn(), 2600);
  }, 2500);
}
function finishTurn(){
  const t = S.conv.turn; S.conv.turn = null; clearInterval(paneTimer);
  if(t.kind === "offer"){
    S.conv.extra.push({who:"cc", html:`<p>Applied <code>0042_rate_limits.sql</code> to staging. <code>rate_limit_buckets</code> exists with its primary key on <code>(api_key_id, window_start)</code>, and the limiter on <code>/transfers</code> now reads from it.</p><p>Nothing else in the schema changed.</p>`});
  } else {
    S.conv.extra.push({who:"router", html:`<p>This is a mockup, so nothing went to the fleet. In the real client the answer to your message lands here.</p>`});
  }
  if(S.conv.queued){ const q = S.conv.queued; S.conv.queued = null; S.conv.extra.push({who:"me", text:q}); render(); startTurn("plain"); return; }
  render();
}
function cancelTurn(){
  if(!S.conv.turn) return;
  const kind = S.conv.turn.kind;
  S.conv.turn = null; clearInterval(paneTimer);
  S.conv.extra.push({err:true, kind});
  render();
}
function paintPane(){
  document.querySelectorAll("[data-pane]").forEach(el => { el.innerHTML = paneLines(); });
}
function paneLines(){
  const lines = S.conv.turn ? S.pane : PANE_LAST;
  if(!lines.length) return `<div class="dim">Waiting for the agent's first output…</div>`;
  return lines.slice(-12).map(([c,t]) => `<div class="${c}">${esc(t)}</div>`).join("");
}

function hostKey(t){
  if(t.kind === "local") return "";
  if(t.pinned) return `<div class="keybox ok"><h4>${ic("shield")}Host key pinned</h4><p class="muted">Loomux checks this machine against this key alone.</p><div class="key" style="cursor:default"><div><b>${t.pinned.type}</b><div class="fp">${t.pinned.fp}</div></div></div><div><button class="btn btn-sm btn-deny" data-act="unpin" data-arg="${t.id}">Unpin</button></div></div>`;
  const sc = S.scan[t.id];
  if(!sc) return `<div class="keybox"><h4>${ic("diamond")}Host key not pinned</h4><p>Loomux trusts whatever key your SSH config accepts for this machine. Scan it, compare the fingerprint with the one the machine reports itself, then pin it.</p><div><button class="btn btn-primary btn-sm" data-act="scan" data-arg="${t.id}">${ic("key")}Scan host key</button></div></div>`;
  if(sc.busy) return `<div class="keybox"><h4>${ic("diamond")}Scanning ${esc(t.host)}…</h4><p class="muted">Reading the keys the machine offers. Nothing is trusted yet.</p></div>`;
  if(sc.expired) return `<div class="keybox"><h4>${ic("diamond")}Scan expired</h4><p>A pin must come from a scan under 10 minutes old.</p><div><button class="btn btn-primary btn-sm" data-act="scan" data-arg="${t.id}">${ic("key")}Scan again</button></div></div>`;
  const sel = sc.keys.find(k => k.type === sc.sel);
  return `<div class="keybox"><h4>${ic("diamond")}Pick the key to pin</h4>
    <p>Compare with the machine's own output: <span class="mono">ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub</span></p>
    <div class="keys" role="radiogroup" aria-label="Scanned host keys">${sc.keys.map(k => `<label class="key"><input type="radio" name="${t.id}-key" ${sc.sel===k.type?"checked":""} data-act="pick-key" data-arg="${t.id}|${k.type}"><div><b>${k.type}</b><div class="fp">${k.fp}</div></div></label>`).join("")}</div>
    <label class="check"><input type="checkbox" ${sc.ok?"checked":""} data-act="key-ok" data-arg="${t.id}">I compared this fingerprint with the one the machine reports.</label>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary btn-sm" data-act="pin" data-arg="${t.id}" ${sel && sc.ok ? "" : "disabled"}>${ic("shield")}Pin ${sel ? sel.type : ""} key</button><span class="faint tnum" style="font-size:13px">Scan expires in <span data-until="${sc.exp}">${fmtCount(sc.exp-Date.now())}</span></span></div></div>`;
}
function healthBlock(t){
  const h = t.health, tr = S.test[t.id];
  const res = tr === "busy" ? `<span class="faint">Testing…</span>` : tr ? `<span class="st st-done">${ic("check")}Reachable, tmux ${t.id==="kestrel"?"3.5a":h.tmux}, ${t.id==="kestrel"?41:h.ms} ms</span>` : "";
  return `<div class="facts"><div><span>Status</span><b>${h.reachable ? "Reachable" : "Unreachable"}</b></div><div><span>Latency</span><b>${h.ms} ms</b></div><div><span>tmux</span><b>${h.tmux}</b></div><div><span>Disk free</span><b>${h.disk}</b></div></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn btn-sm" data-act="test" data-arg="${t.id}" ${tr==="busy"?"disabled":""}>Test connection</button>${res}<span class="faint" style="font-size:12.5px">Checked ${h.at}</span></div>`;
}
function wsRows(t){
  const ws = S.workspaces.filter(w => w.target === t.id);
  if(!ws.length) return `<p class="faint">No workspaces yet. Ask for work on ${esc(t.name)} in a conversation and Loomux sets one up.</p>`;
  return `<div>${ws.map(w => {
    const acts = [];
    if(w.st === "archived" || w.st === "broken") acts.push(`<button class="btn btn-sm" data-act="ws" data-arg="${w.id}|reopen">Reopen</button>`);
    if(w.st === "idle" || w.st === "broken") acts.push(`<button class="btn btn-sm" data-act="ws" data-arg="${w.id}|archive">Archive</button>`);
    if(w.st !== "provisioning") acts.push(`<button class="btn btn-sm btn-deny" data-act="ws" data-arg="${w.id}|delete">Delete</button>`);
    const conf = S.wsConfirm === w.id ? `<div class="confirm" role="alert"><p>Delete ${esc(w.name)} and its tasks? The conversation history stays, and its files on the machine are kept.</p><div class="acts"><button class="btn btn-sm btn-danger" data-act="ws" data-arg="${w.id}|yes">Yes, delete</button><button class="btn btn-sm" data-act="ws" data-arg="${w.id}|keep">Keep</button></div></div>` : "";
    return `<div class="ws"><div class="main"><b>${esc(w.name)}</b><span style="font-size:13px" class="muted">target: ${esc(t.name)}</span>${w.reason ? `<p class="faint" style="font-size:13px">${esc(w.reason)}</p>` : ""}</div>${st(w.st)}<div class="acts">${acts.join("")}</div>${conf}</div>`;
  }).join("")}</div>`;
}
function targetDetail(t, dev){
  const tc = S.tConfirm === t.id;
  return `
    <div class="sect"><h3>Connection</h3>${healthBlock(t)}</div>
    ${t.kind !== "local" ? `<div class="sect"><h3>Host key</h3>${hostKey(t)}</div>` : ""}
    <div class="sect"><h3>What Loomux may do here</h3>${policyList(t)}</div>
    <div class="sect"><h3>What the router's models may see</h3>${relayCtl(t)}</div>
    <div class="sect"><h3>Workspaces</h3>${wsRows(t)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" data-act="edit-target" data-arg="${t.id}">Edit target</button><button class="btn btn-sm btn-deny" data-act="del-target" data-arg="${t.id}">Delete target</button></div>
    ${tc ? `<div class="confirm" role="alert"><p>${S.workspaces.some(w=>w.target===t.id) ? `Workspaces still use ${esc(t.name)}, so Loomux will refuse to delete it. Delete or move those first.` : `Delete ${esc(t.name)}?`}</p><div class="acts"><button class="btn btn-sm" data-act="del-target-keep">Keep</button></div></div>` : ""}`;
}
function targetForm(dev){
  const f = S.form.v, isNew = S.form.mode === "new";

  const chk = (k, label) => `<label class="check"><input type="checkbox" data-fmodel="${k}" ${f[k]?"checked":""}>${label}</label>`;
  return `<form class="form" data-form="target" aria-label="${isNew ? "Register target" : "Edit " + esc(f.name)}">
    <h2 style="font-size:20px;font-weight:800">${isNew ? "Register a machine" : "Edit " + esc(f.name)}</h2>
    ${fld("name","Name",'autocomplete="off"')}
    <div class="field"><label for="${dev}-f-kind">Kind</label><select class="inp" id="${dev}-f-kind" data-fmodel="kind" data-rerender><option value="remote" ${f.kind==="remote"?"selected":""}>Remote, over SSH</option><option value="local" ${f.kind==="local"?"selected":""}>This host</option></select></div>
    ${f.kind === "remote" ? `<div class="two">${fld("host","Host",'autocomplete="off" placeholder="build-01.lab.example"')}${fld("user","User",'autocomplete="off"')}</div>${fld("port","SSH port",'inputmode="numeric"',"Leave at 0 to use your SSH config's port.")}` : ""}
    ${fld("root","Workspace root (optional)",'placeholder="/home/agent/loomux-workspaces"',"An absolute path. Empty means ~/loomux-workspaces.")}
    <div class="field"><label for="${dev}-f-perm">How much agents may do without asking</label><select class="inp" id="${dev}-f-perm" data-fmodel="perm"><option value="">Each agent's default</option><option value="auto" ${f.perm==="auto"?"selected":""}>Auto: act without asking</option><option value="accept-edits" ${f.perm==="accept-edits"?"selected":""}>Accept edits: edit files, ask for the rest</option><option value="manual" ${f.perm==="manual"?"selected":""}>Manual: ask before every edit</option></select></div>
    <fieldset><legend>Policy</legend>
      <div class="field"><label for="${dev}-f-purpose">Purpose</label><select class="inp" id="${dev}-f-purpose" data-fmodel="purpose"><option value="personal">Personal</option><option value="work" ${f.purpose==="work"?"selected":""}>Work: agents run under your work logins</option></select></div>
      ${fld("agents","Allowed agent types (optional)",'placeholder="all agent types"',"Comma-separated, e.g. claude-code, codex.")}
      ${chk("provision","Allow new workspaces here")}${chk("shell","Allow plain shell commands here")}${chk("confirm","Ask me before starting new work here")}
    </fieldset>
    ${S.formErr ? `<p class="err" role="alert">${ic("tri")}${esc(S.formErr)}</p>` : ""}
    <div class="acts"><button class="btn btn-primary" type="submit">${isNew ? "Register" : "Save changes"}</button><button class="btn" type="button" data-act="form-cancel">Cancel</button></div>
  </form>`;
}
function tStatus(t){
  if(t.kind !== "local" && !t.pinned) return st("approval","Pin host key");
  return st("done","Healthy");
}

// ---------- vault ----------
function scopeChips(c){
  if(!c.ws && !c.agent) return `<span class="scope all">Every workspace and agent</span>`;
  return (c.ws ? `<span class="scope">Workspace ${esc(c.ws)}</span>` : "") + (c.agent ? `<span class="scope">Agent ${esc(c.agent)}</span>` : "");
}
function vaultHTML(dev){
  const add = S.vaultAdd ? `<form class="form tcard" style="padding:16px" data-form="v-add" aria-label="Add credential">
      <h2 style="font-size:18px;font-weight:800">Add credential</h2>
      <div class="field"><label for="${dev}-v-name">Name (environment variable)</label><input class="inp mono" id="${dev}-v-name" data-model="vName" value="${esc(S.drafts.vName)}" placeholder="GITHUB_TOKEN" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="${dev}-v-val">Value</label><input class="inp" id="${dev}-v-val" type="password" autocomplete="new-password"><small>You won't see it again after saving. You can replace it later.</small></div>
      <div class="two" style="display:grid;grid-template-columns:${dev==="p"?"1fr":"1fr 1fr"};gap:12px">
        <div class="field"><label for="${dev}-v-ws">Only for workspace (optional)</label><select class="inp" id="${dev}-v-ws" data-model="vWs"><option value="">Any workspace</option>${S.workspaces.map(w => `<option ${S.drafts.vWs===w.name?"selected":""}>${esc(w.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="${dev}-v-agent">Only for agent type (optional)</label><input class="inp" id="${dev}-v-agent" data-model="vAgent" value="${esc(S.drafts.vAgent)}" placeholder="claude-code" autocomplete="off"></div>
      </div>
      ${S.vaultErr ? `<p class="err" role="alert">${ic("tri")}${esc(S.vaultErr)}</p>` : ""}
      <div class="acts"><button class="btn btn-primary" type="submit">Save</button><button class="btn" type="button" data-act="v-cancel">Cancel</button></div></form>`
    : `<div><button class="btn btn-primary" data-act="v-add">${ic("plus")}Add credential</button></div>`;
  const rows = S.creds.map(c => {
    let extra = "";
    if(S.replacing === c.id) extra = `<form class="replyrow" data-form="v-replace" data-arg="${c.id}" aria-label="New value for ${esc(c.name)}"><label class="vh" for="${dev}-nv-${c.id}">New value</label><input class="inp" type="password" id="${dev}-nv-${c.id}" autocomplete="new-password" placeholder="New value"><button class="btn btn-primary" type="submit">Save</button><button class="btn" type="button" data-act="v-rcancel">Cancel</button></form>`;
    else if(S.deleting === c.id) extra = `<div class="confirm" role="alert"><p>Agents that start after this won't get ${esc(c.name)}.</p><div class="acts"><button class="btn btn-sm btn-danger" data-act="v-del-yes" data-arg="${c.id}">Delete ${esc(c.name)}</button><button class="btn btn-sm" data-act="v-dcancel">Keep</button></div></div>`;
    return `<div class="cred"><div class="top"><span class="name">${esc(c.name)}</span><span class="lock">${ic("lock")}Value hidden</span></div><div class="chips">${scopeChips(c)}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="faint" style="font-size:13px;flex:1">Updated ${esc(c.upd)}</span><div class="acts"><button class="btn btn-sm" data-act="v-replace" data-arg="${c.id}">Replace value</button><button class="btn btn-sm btn-deny" data-act="v-del" data-arg="${c.id}">Delete</button></div></div>${extra}</div>`;
  }).join("");
  return `<p class="muted" style="max-width:62ch">Secrets your agents get as environment variables when they start. Values are write-only: you can replace or delete one, never read it back.</p>${add}
    <div class="rows" style="cursor:default">${rows || `<p style="padding:16px" class="muted">No credentials yet.</p>`}</div>`;
}

function tabs(cur){
  const n = needsCount();
  const t = (k, label, icon, extra="") => `<button class="tab" data-act="tab" data-arg="${k}" ${cur===k?'aria-current="page"':""}><span class="tpill">${ic(icon)}</span>${label}${extra}</button>`;
  return `<nav class="tabs" aria-label="Main">${t("inbox","Inbox","inbox", n ? `<span class="badge" aria-label="${n} need you">${n}</span>` : "")}${t("list","Conversations","chat")}${t("machines","Machines","server")}${t("more","More","more")}</nav>`;

function pSheet(){
  const s = S.ui.p.sheet; if(!s) return "";
  let inner = "";
  if(s === "more") inner = `<div class="grab"></div><div class="menu"><button data-act="nav" data-arg="vault">${ic("key")}Vault</button><button data-act="sheet" data-arg="settings">${ic("gear")}Settings and devices</button><button data-act="logout">${ic("out")}Log out</button></div>`;

const toastHTML = () => S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "";
function phoneApp(){

function convList(){
  const f = S.filter;
  const groups = {all:null, you:["approval","asking","waiting","failed"], running:["working"], done:["done"]};
  const rows = CONVS.filter(c => !groups[f] || groups[f].includes(c.st));
  const chip = (k, l) => `<button class="chip" data-act="filter" data-arg="${k}" aria-pressed="${f===k}">${l}</button>`;
  return `<div class="chips">${chip("all","All")}${chip("you","Needs you")}${chip("running","Running")}${chip("done","Done")}</div>
    <div class="rows">${rows.map(c => `<button class="row" data-act="open" data-arg="${c.id}"><div class="main"><div class="t">${esc(c.title)}</div><div class="s">${esc(c.where)}</div><div style="margin-top:3px">${st(c.st)}</div></div><span class="end">${esc(c.t)}</span></button>`).join("") || `<p style="padding:16px" class="muted">No conversations match this filter.</p>`}</div>`;
}

          <h2 class="sec-h">Done today</h2>${doneRows()}
        </div></div></div>
      <aside class="col side" aria-label="Preview">${preview()}</aside></div>`;
  } else if(scr === "conversation"){
    const h = convHead();
    main = `<div class="d-main" style="grid-template-columns:1fr ${S.convId==="new"?"0px":"370px"}">
      <div class="col"><header class="t-head"><div class="ttl"><h1>${esc(h.title)}</h1><div class="sub">${h.sub}<span class="live" style="margin-left:auto"><i></i>Connected</span></div></div></header>
        <div class="scroll" data-sk="thread"><div class="thread">${threadHTML("d")}</div></div>${composer("d")}</div>
      ${S.convId!=="new" ? `<aside class="col side" aria-label="About this conversation"><div class="scroll" data-sk="ctx">${contextHTML("d")}</div></aside>` : "<div></div>"}</div>`;
    cur = "list";
  } else if(scr === "list"){
    main = `<div class="d-main"><div class="col" style="max-width:860px"><div class="col-head"><h1>Conversations</h1><button class="btn btn-primary" data-act="open" data-arg="new">${ic("plus")}New conversation</button></div><div class="scroll"><div class="col-body">${convList()}</div></div></div></div>`;
  } else if(scr === "machines"){
    const t = tgt(S.target);
    const right = S.form ? `<div class="col-body" style="padding-top:24px;max-width:640px">${targetForm("d")}</div>`
      : `<div class="col-head"><div style="flex:1;min-width:0"><h1>${esc(t.name)}</h1><p class="muted">${esc(dest(t))}${t.kind==="remote"?", remote over SSH":", the machine Loomux runs on"}</p></div>${tStatus(t)}</div><div class="col-body" style="gap:26px;max-width:760px">${targetDetail(t,"d")}</div>`;
    main = `<div class="d-main" style="grid-template-columns:330px 1fr">
      <div class="col" style="border-right:1px solid var(--line)"><div class="col-head"><h1>Machines</h1><button class="btn btn-sm" data-act="register">${ic("plus")}Register</button></div>
        <div class="col-body" style="padding:0 16px 16px"><div class="rows tlist">${S.targets.map(x => `<button class="row" data-act="tsel" data-arg="${x.id}" aria-current="${x.id===S.target && !S.form}"><div class="main"><div class="t">${esc(x.name)}</div><div class="s">${esc(dest(x))}</div><div class="s">${S.workspaces.filter(w=>w.target===x.id).length} workspaces${x.purpose==="work"?", work":""}</div></div>${tStatus(x)}</button>`).join("")}</div></div></div>
      <div class="col"><div class="scroll" data-sk="mdetail">${right}</div></div></div>`;
  } else if(scr === "vault"){
    main = `<div class="d-main"><div class="col"><div class="col-head" style="max-width:820px"><h1>Vault</h1></div><div class="scroll"><div class="col-body" style="max-width:820px">${vaultHTML("d")}</div></div></div></div>`;
  }
  const modal = S.ui.d.sheet === "settings" ? `<div class="modal-wrap"><button class="scrim" data-act="sheet-close" aria-label="Close"></button><div class="modal" role="dialog" aria-label="Settings"><h2 style="font-size:20px;font-weight:800">Settings</h2>${settingsHTML()}</div></div>` : "";
  return `<div class="d-shell">${rail(cur)}${main}</div>${modal}${toastHTML()}`;
}

// ---------- render loop ----------
function render(){
  for(const dev of ["p","d"]){
    const root = document.getElementById("frame-"+dev);
    if(!root) continue;
    const ae = document.activeElement, fid = ae && root.contains(ae) ? ae.id : null;
    let sel = null; try { if(fid && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch(e){}
    const saved = {};
    root.querySelectorAll("[data-sk]").forEach(el => { saved[el.dataset.sk] = {top:el.scrollTop, bottom:el.scrollHeight - el.scrollTop - el.clientHeight < 40}; });
    root.innerHTML = dev === "p" ? phoneApp() : deskApp();
    root.querySelectorAll("[data-sk]").forEach(el => {
      const s = saved[el.dataset.sk];
      if(!s){ if(el.dataset.sk === "thread") el.scrollTop = el.scrollHeight; return; }
      el.scrollTop = s.bottom && el.dataset.sk === "thread" ? el.scrollHeight : s.top;
    });
    if(fid){ const el = document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
  }
}
function tick(){
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach(el => el.textContent = fmtElapsed(now - +el.dataset.since));
  document.querySelectorAll("[data-until]").forEach(el => el.textContent = fmtCount(+el.dataset.until - now));
  let dirty = false;
  if(S.inbox.offer.state === "pending" && now >= S.inbox.offer.exp){ S.inbox.offer.state = "expired"; dirty = true; }
  if(S.conv.offer === "pending" && now >= S.conv.exp){ S.conv.offer = "expired"; dirty = true; }
  for(const k in S.scan){ const sc = S.scan[k]; if(sc && sc.exp && !sc.expired && now >= sc.exp){ sc.expired = true; dirty = true; } }
  if(dirty) render();
}

// ---------- prototype shell ----------
function store(k, v){ try { localStorage.setItem("shuttle."+k, v); } catch(e){} }
function load(k){ try { return localStorage.getItem("shuttle."+k); } catch(e){ return null; } }
function applyTheme(){ const r = document.documentElement; if(S.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme); }
function syncTools(){
  document.querySelectorAll("[data-tool]").forEach(b => {
    const [k, v] = b.dataset.tool.split(":");
    const cur = k === "screen" ? ({list:"conversation"}[S.screen] || S.screen) : S[k];
    b.setAttribute("aria-pressed", String(cur === v));
  });
}
function buildStage(){
  const st = document.getElementById("stage");
  const desk = `<div class="desk-slot"><p class="slot-cap">Desktop, 1280 by 820</p><div class="desk-vp" id="dvp"><div class="desk" id="desk"><div class="winbar" aria-hidden="true"><i></i><i></i><i></i><span>loomux.lab.example</span></div><div class="app is-d" id="frame-d" data-dev="d"></div></div></div></div>`;
  const phone = `<div class="phone-slot"><p class="slot-cap">Phone, 390 by 844, installed app</p><div class="phone-vp" id="pvp"><div class="phone" id="phone"><div class="app is-p" id="frame-p" data-dev="p"></div></div></div></div>`;
  st.innerHTML = (S.frame !== "phone" ? desk : "") + (S.frame !== "desktop" ? phone : "");
  render(); fit();
}
function fit(){
  const st = document.getElementById("stage");
  const dvp = document.getElementById("dvp");
  if(dvp){ const w = dvp.parentElement.clientWidth, s = Math.min(1, w / 1280); document.getElementById("desk").style.transform = `scale(${s})`; dvp.style.width = 1280*s + "px"; dvp.style.height = 820*s + "px"; }
  const pvp = document.getElementById("pvp");
  if(pvp){ const s = Math.min(1, st.clientWidth / 410); document.getElementById("phone").style.transform = `scale(${s})`; pvp.style.width = 410*s + "px"; pvp.style.height = 864*s + "px"; }
}

// ---------- actions ----------
function closeSheets(){ S.ui.p.sheet = null; S.ui.d.sheet = null; }
const NEW_FORM = () => ({name:"", kind:"remote", host:"", user:"", port:"0", root:"", perm:"", purpose:"personal", agents:"", provision:true, shell:true, confirm:false});
S.newMsgs = [];
const A = {
  open(id){ S.convId = id === "new" ? "new" : "ratelimit"; S.screen = "conversation"; closeSheets(); if(id === "new") S.newMsgs = []; },
  nav(k){ S.screen = k; closeSheets(); S.form = null; },
  tab(k){ if(k === "more"){ S.ui.p.sheet = "more"; return; } S.screen = k; closeSheets(); S.form = null; },
  sheet(k, dev){ S.ui[dev].sheet = k; },
  "sheet-close"(a, dev){ S.ui[dev].sheet = null; if(dev === "p" && S.form) S.form = null; },
  sel(id){ S.sel = id; },
  "i-offer"(v){ S.inbox.offer.state = v; if(v === "approved") S.inbox.running.unshift({id:"restart", title:"Restart the staging ledger deploy", stage:"Running a command in infra-terraform…", since:Date.now()}); },
  "i-prompt"(v){ S.inbox.prompt = {state:"answered", answer:v}; },
  "i-retry"(){ S.inbox.failed.state = "retrying"; setTimeout(() => { S.inbox.running.push({id:"tf", title:"Bump terraform providers", stage:"claude-code is working in infra-terraform", since:Date.now()}); render(); }, 1500); },
  older(){ S.inbox.older.open = !S.inbox.older.open; },
  snooze(){ S.inbox.older.snoozed = true; },
  unsnooze(){ S.inbox.older.snoozed = false; },
  filter(f){ S.filter = f; },
  example(t){ S.drafts.compose = t; },
  "c-offer"(v){
    S.conv.offer = v;
    S.conv.extra.push({who:"me", text: v === "approved" ? "yes" : "no"});
    if(v === "approved") startTurn("offer");
    else S.conv.extra.push({who:"router", html:"<p>Okay, nothing was run. The migration file is still in the workspace if you want it later.</p>"});
  },
  cancel(){ cancelTurn(); },
  "c-retry"(k){ startTurn(k || "plain"); },
  "toggle-attach"(){ S.conv.showAttach = !S.conv.showAttach; },
  unqueue(){ S.drafts.compose = S.conv.queued; S.conv.queued = null; },
  copy(id){
    const el = document.getElementById(id); if(!el) return;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl+C to copy."); };
    try { navigator.clipboard.writeText(el.textContent).then(() => toast("Copied"), fallback); } catch(e){ fallback(); }
    return "norender";
  },
  toast(m){ toast(m); return "norender"; },
  topen(id){ S.open[id] = !S.open[id]; },
  tsel(id){ S.target = id; S.form = null; S.tConfirm = null; },
  relay(arg){ const [id, v] = arg.split("|"); tgt(id).relay = v; },
  scan(id){
    S.scan[id] = {busy:true};
    setTimeout(() => { S.scan[id] = {exp:Date.now() + 598e3, sel:"ED25519", ok:false, keys:[
      {type:"ED25519", fp:"SHA256:7mWq3pX9Lr2cVd8Kz1TnYh4bGf6sJe0uQa5oRiN2xwE"},
      {type:"ECDSA", fp:"SHA256:Ub8Kd2Ls9Wq4Xn7Rc1Vm5Tg3Hy6Jp0Ze8Fa2Qo4Bk9"},
      {type:"RSA", fp:"SHA256:c4Nv7Rq1Wm8Kx2Ld5Ts9Hb3Yg6Jf0Pa4Ue7Zo1Qi8"}]}; render(); }, 1100);
  },
  "pick-key"(arg){ const [id, ty] = arg.split("|"); S.scan[id].sel = ty; },
  "key-ok"(id){ S.scan[id].ok = !S.scan[id].ok; },
  pin(id){ const sc = S.scan[id], k = sc.keys.find(x => x.type === sc.sel); tgt(id).pinned = k; delete S.scan[id]; toast(`Pinned the ${k.type} key for ${tgt(id).name}`); return "norender"; },
  unpin(id){ tgt(id).pinned = null; toast(`Unpinned ${tgt(id).name}'s host key`); return "norender"; },
  test(id){ S.test[id] = "busy"; setTimeout(() => { S.test[id] = "ok"; const t = tgt(id); if(t.health) t.health.at = "just now"; else t.health = {reachable:true, ms:41, tmux:"3.5a", disk:"n/a", at:"just now"}; render(); }, 1300); },
  ws(arg){
    const [id, op] = arg.split("|"), w = S.workspaces.find(x => x.id === id);
    if(op === "reopen"){ w.st = "idle"; delete w.reason; }
    if(op === "archive") w.st = "archived";
    if(op === "delete") S.wsConfirm = id;
    if(op === "keep") S.wsConfirm = null;
    if(op === "yes"){ S.workspaces = S.workspaces.filter(x => x.id !== id); S.wsConfirm = null; toast(`Deleted ${w.name}`); return "norender"; }
  },
  "edit-target"(id, dev){ const t = tgt(id); S.form = {mode:"edit", id, v:{name:t.name, kind:t.kind, host:t.host, user:t.user, port:String(t.port), root:t.root, perm:t.perm, purpose:t.purpose, agents:t.agents.join(", "), provision:t.provision, shell:t.shell, confirm:t.confirm}}; S.formErr = ""; if(dev === "p") S.ui.p.sheet = "form"; },
  register(a, dev){ S.form = {mode:"new", v:NEW_FORM()}; S.formErr = ""; if(dev === "p") S.ui.p.sheet = "form"; },
  "form-cancel"(){ S.form = null; S.ui.p.sheet = null; },
  "del-target"(id){ S.tConfirm = id; },
  "del-target-keep"(){ S.tConfirm = null; },
  "v-add"(){ S.vaultAdd = true; S.vaultErr = ""; },
  "v-cancel"(){ S.vaultAdd = false; S.vaultErr = ""; S.drafts.vName = ""; S.drafts.vAgent = ""; S.drafts.vWs = ""; },
  "v-replace"(id){ S.replacing = id; S.deleting = null; },
  "v-rcancel"(){ S.replacing = null; },
  "v-del"(id){ S.deleting = id; S.replacing = null; },
  "v-dcancel"(){ S.deleting = null; },
  "v-del-yes"(id){ const c = S.creds.find(x => x.id === id); S.creds = S.creds.filter(x => x.id !== id); S.deleting = null; toast(`Deleted ${c.name}`); return "norender"; },
  "dev-out"(id){ const d = S.devices.find(x => x.id === id); S.devices = S.devices.filter(x => x.id !== id); toast(`Logged out ${d.name}`); return "norender"; },
  logout(){ closeSheets(); S.screen = "login"; S.login = {err:"", busy:false, back:""}; },
};
const FORMS = {
  "i-reply"(form){ const t = S.drafts.reply.trim(); if(!t) return; S.inbox.prompt = {state:"answered", answer:`"${t}"`}; S.drafts.reply = ""; },
  send(){
    const t = S.drafts.compose.trim(); if(!t) return;
    S.drafts.compose = "";
    if(S.convId === "new"){ toast("In the real client this starts the conversation and opens its turn."); return "norender"; }
    if(S.conv.turn){ S.conv.queued = S.conv.queued ? S.conv.queued + "\n" + t : t; return; }
    S.conv.extra.push({who:"me", text:t}); startTurn("plain"); return "norender";
  },
  target(form, dev){
    const v = S.form.v; v.name = v.name.trim(); v.host = v.host.trim(); v.user = v.user.trim(); v.root = v.root.trim();
    const port = Number(v.port || 0);
    let err = "";
    if(!v.name) err = "Give the machine a name.";
    else if(v.kind === "remote" && (!v.host || !v.user)) err = "Host and user are required for a remote target.";
    else if(v.kind === "remote" && (!Number.isInteger(port) || port < 0 || port > 65535)) err = "The SSH port must be a number from 0 to 65535.";
    else if(v.root && (!v.root.startsWith("/") || v.root === "/")) err = "The workspace root must be an absolute path, and not /.";
    S.formErr = err; if(err) return;
    const fields = {name:v.name, kind:v.kind, host:v.kind==="remote"?v.host:"", user:v.kind==="remote"?v.user:"", port:v.kind==="remote"?port:0, root:v.root, perm:v.perm, purpose:v.purpose, agents:v.agents.split(",").map(s=>s.trim()).filter(Boolean), provision:v.provision, shell:v.shell, confirm:v.confirm};
    let id;
    if(S.form.mode === "new"){ id = "t" + Date.now(); S.targets.push({id, relay:"", pinned:null, health:null, ...fields}); }
    else { id = S.form.id; Object.assign(tgt(id), fields); }
    const was = S.form.mode; S.form = null; S.ui.p.sheet = null; S.target = id; S.open[id] = true;
    toast(was === "new" ? `Registered ${fields.name}` : `Saved ${fields.name}`); return "norender";
  },
  "v-add"(form, dev){
    const name = S.drafts.vName.trim(), valEl = form.querySelector('input[type="password"]'), val = valEl.value;
    const agent = S.drafts.vAgent.trim(), ws = S.drafts.vWs;
    let err = "";
    if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) err = "The name becomes an environment variable: letters, digits and _, not starting with a digit.";
    else if(["PATH","HOME","SHELL","USER","TERM"].includes(name) || name.startsWith("LOOMUX_")) err = "That name is used by the shell or by Loomux itself. Pick another.";
    else if(S.creds.some(c => c.name === name && c.ws === ws && c.agent === agent)) err = "A credential with that name already exists for this scope. Replace its value instead.";
    else if(!val) err = "Enter a value.";
    S.vaultErr = err; if(err) return;
    valEl.value = "";
    S.creds.push({id:"c" + Date.now(), name, ws, agent, upd:"just now"});
    S.vaultAdd = false; S.drafts.vName = ""; S.drafts.vAgent = ""; S.drafts.vWs = "";
    toast(`Saved ${name}`); return "norender";
  },
  "v-replace"(form){
    const id = form.dataset.arg, el = form.querySelector("input"), c = S.creds.find(x => x.id === id);
    if(!el.value){ toast("Enter a new value first."); return "norender"; }
    el.value = ""; c.upd = "just now"; S.replacing = null; toast(`Replaced the value of ${c.name}`); return "norender";
  },
  login(form){
    const pw = form.querySelector('input[type="password"]').value;
    S.login.busy = true; S.login.err = ""; render();
    setTimeout(() => {
      S.login.busy = false;
      if(pw === "loom"){ const back = S.login.back; S.login.back = "Restart the staging ledger deploy"; S.screen = back ? "inbox" : "inbox"; S.sel = "restart"; toast("Logged in"); syncTools(); }
      else { S.login.err = "That password didn't work (invalid password). Check it and try again."; render(); }
    }, 700);
    return "norender";
  },
};

document.addEventListener("click", e => {
  const tool = e.target.closest("[data-tool]");
  if(tool){
    const [k, v] = tool.dataset.tool.split(":");
    if(k === "screen"){ S.screen = v; closeSheets(); S.form = null; if(v === "conversation" && S.convId === "new") S.convId = "ratelimit"; render(); }
    if(k === "frame"){ S.frame = v; store("frame", v); buildStage(); }
    if(k === "theme"){ S.theme = v; store("theme", v); applyTheme(); }
    store("screen", S.screen); syncTools(); return;
  }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(el.dataset.act === "sel" && e.target.closest("summary, input, textarea, select, label, form")) return;
  const root = el.closest("[data-dev]"); const dev = root ? root.dataset.dev : "d";
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault();
  const r = fn(el.dataset.arg, dev);
  if(r !== "norender") render();
  syncTools();
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if(!f) return;
  e.preventDefault();
  const root = f.closest("[data-dev]"); const dev = root ? root.dataset.dev : "d";
  const r = FORMS[f.dataset.form](f, dev);
  if(r !== "norender") render();
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.model){
    S.drafts[t.dataset.model] = t.value;
    if(t.dataset.grow){ t.rows = Math.min(6, Math.max(1, t.value.split("\n").length)); const b = t.form && t.form.querySelector('button[type="submit"]'); if(b) b.disabled = !t.value.trim(); }
  }
  if(t.dataset.fmodel && S.form){ S.form.v[t.dataset.fmodel] = t.type === "checkbox" ? t.checked : t.value; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.fmodel && S.form){ S.form.v[t.dataset.fmodel] = t.type === "checkbox" ? t.checked : t.value; if(t.dataset.rerender) render(); }
  if(t.dataset.model && t.tagName === "SELECT") S.drafts[t.dataset.model] = t.value;
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if(t.dataset && t.dataset.model === "compose" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); t.form.requestSubmit(); }
});

// ---------- boot ----------
(function boot(){
  S.frame = load("frame") || (innerWidth < 900 ? "phone" : "both");
  S.theme = load("theme") || "system";
  const sc = load("screen"); if(sc && ["inbox","conversation","machines","vault","login","list"].includes(sc)) S.screen = sc;
  applyTheme(); buildStage(); syncTools();
  addEventListener("resize", fit);
  setInterval(tick, 1000);
})();
</script>

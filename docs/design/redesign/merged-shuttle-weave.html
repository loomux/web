<title>Loomux Shuttle + Weave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap">
<style>
/* Shuttle + Weave: Loomux as a messenger for your agents, with the day drawn as a loom.
   Phone: one column + bottom bar (Inbox, Today, Machines, More). Desktop: rail | queue or thread | context.
   Today = the read-back view: the weave (workspaces as warp lanes grouped by machine, conversations as weft,
   turns/offers/prompts as stitches) above All conversations. Inbox gains a day strip that opens Today.
   The one bold thing: the needs-you answer cards (marigold band ending in a woven hatch). */
:root{
  --ground:#E9EEF3; --surface:#FFFFFF; --surface-2:#F4F7FA; --sunken:#DFE6ED;
  --ink:#14202C; --ink-2:#465668; --ink-3:#6A7A8C; --line:#D2DBE4;
  --accent:#0B7A85; --accent-hover:#08646D; --accent-ink:#FFFFFF; --accent-soft:#DCEFF0;
  --mari:#EFA10C; --mari-2:#F8C75A; --mari-soft:#FFF3D8; --mari-ink:#5A3A00; --mari-on:#281A00;
  --bad:#BC372D; --bad-soft:#FBE7E4; --good:#2B7849; --good-soft:#E1F1E7;
  --pane:#0E1A26; --pane-ink:#C8DDE5; --pane-dim:#6D899A; --pane-hi:#F8C75A;
  --proto:#6A4ED6; --proto-soft:#EEEAFD; --chrome:#DAE2EA; --chrome-ink:#24303C; --device:#1B2531;
  --focus:#0B7A85; --scrim:rgba(14,22,32,.42);
  --lane-1:#0B7A85; --lane-2:#5B67B8; --lane-3:#8B5A9C; --lane-4:#4D7C3A;
  --shadow:0 1px 2px rgba(20,32,44,.06),0 10px 28px rgba(20,32,44,.09);
  --f-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0C1426; --surface:#132036; --surface-2:#17263E; --sunken:#0A1120;
  --ink:#E4EBF5; --ink-2:#A2B1C5; --ink-3:#7C8CA2; --line:#24344F;
  --accent:#43BAC5; --accent-hover:#62CBD4; --accent-ink:#03272B; --accent-soft:#0F313A;
  --mari:#F5B23A; --mari-2:#FFD27C; --mari-soft:#32260C; --mari-ink:#FFE1A6; --mari-on:#281A00;
  --bad:#FF8075; --bad-soft:#3A1815; --good:#6CCF95; --good-soft:#102F1E;
  --pane:#060B15; --pane-ink:#BED4DD; --pane-dim:#5C7284; --pane-hi:#FFD27C;
  --proto:#A897FF; --proto-soft:#221C45; --chrome:#08101E; --chrome-ink:#D5DEEA; --device:#02060D;
  --focus:#62CBD4; --scrim:rgba(0,0,0,.55);
  --lane-1:#43BAC5; --lane-2:#98A3F0; --lane-3:#CB97DC; --lane-4:#8FC97A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0C1426; --surface:#132036; --surface-2:#17263E; --sunken:#0A1120;
  --ink:#E4EBF5; --ink-2:#A2B1C5; --ink-3:#7C8CA2; --line:#24344F;
  --accent:#43BAC5; --accent-hover:#62CBD4; --accent-ink:#03272B; --accent-soft:#0F313A;
  --mari:#F5B23A; --mari-2:#FFD27C; --mari-soft:#32260C; --mari-ink:#FFE1A6; --mari-on:#281A00;
  --bad:#FF8075; --bad-soft:#3A1815; --good:#6CCF95; --good-soft:#102F1E;
  --pane:#060B15; --pane-ink:#BED4DD; --pane-dim:#5C7284; --pane-hi:#FFD27C;
  --proto:#A897FF; --proto-soft:#221C45; --chrome:#08101E; --chrome-ink:#D5DEEA; --device:#02060D;
  --focus:#62CBD4; --scrim:rgba(0,0,0,.55);
  --lane-1:#43BAC5; --lane-2:#98A3F0; --lane-3:#CB97DC; --lane-4:#8FC97A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--chrome);color:var(--chrome-ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;padding:0 16px 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype toolbar (not part of the design) ---------- */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 0;background:var(--chrome);border-bottom:1px solid var(--line);margin-bottom:20px}
.proto-name{font-weight:800;font-size:15px;margin-right:auto;display:flex;gap:8px;align-items:center}
.proto-name small{font-weight:400;color:var(--ink-3)}
.pgroup{display:flex;align-items:center;gap:6px;min-width:0}
.pgroup>span{font-size:12px;color:var(--ink-3)}
.pseg{display:flex;background:var(--sunken);border-radius:9px;padding:2px;overflow-x:auto;max-width:100%}
.pseg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.pseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{border:1.5px dashed var(--proto);background:var(--proto-soft);color:var(--proto);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.note b{font-weight:700}

/* ---------- stage ---------- */
.stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.desk-slot{flex:1 1 640px;min-width:0}
.phone-slot{flex:0 0 auto;max-width:100%}
.slot-cap{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.desk-vp,.phone-vp{position:relative;overflow:hidden}
.desk{width:1280px;height:820px;transform-origin:top left;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;background:var(--ground)}
.winbar{height:32px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--sunken);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.winbar i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.winbar span{margin-left:14px;background:var(--surface);padding:2px 12px;border-radius:6px}
.phone{width:410px;height:864px;transform-origin:top left;border:10px solid var(--device);border-radius:46px;overflow:hidden;box-shadow:var(--shadow);background:var(--ground)}

/* ---------- app ---------- */
.app{background:var(--ground);color:var(--ink);font-family:var(--f-ui);position:relative;overflow:hidden;display:flex;flex-direction:column;height:100%;min-height:0}
.desk .app{flex:1}
.app h1,.app h2,.app h3{text-wrap:balance;margin:0}
.app p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}
.sb{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12.5px;font-weight:700;color:var(--ink)}
.scroll{overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid transparent;padding:0 16px;min-height:40px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--surface-2);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:transparent}
.btn-approve{background:var(--accent);color:var(--accent-ink)}
.btn-approve:hover{background:var(--accent-hover);border-color:transparent}
.btn-deny{background:transparent;border-color:var(--ink-3);color:var(--ink)}
.btn-deny:hover{border-color:var(--ink)}
.btn-danger{background:var(--bad);color:var(--surface)}
.btn-quiet{background:transparent;color:var(--accent);padding:0 8px}
.btn-quiet:hover{border-color:transparent;text-decoration:underline}
.btn-sm{min-height:32px;font-size:13.5px;padding:0 12px;border-radius:9px}
.is-p .btn{min-height:44px}
.is-p .btn-sm{min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--mari);color:var(--mari-on);font-size:12.5px;font-weight:800}

/* status shapes */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.st svg{width:14px;height:14px;flex:none}
.st-approval,.st-asking,.st-waiting{color:var(--mari-ink)}
.st-approval svg,.st-asking svg,.st-waiting svg{color:var(--mari)}
.st-working{color:var(--accent)}
.st-done{color:var(--good)}
.st-failed{color:var(--bad)}
.st-idle,.st-archived{color:var(--ink-2)}
.st-active{color:var(--accent)}
.st-broken{color:var(--bad)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- answer cards: the bold thing ---------- */
.ask{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.ask-band{display:flex;align-items:center;gap:8px;padding:9px 84px 9px 16px;min-height:40px;font-weight:800;font-size:14px;color:var(--mari-on);
  background:linear-gradient(90deg,var(--mari) 0,var(--mari) calc(100% - 76px),transparent calc(100% - 76px)),repeating-linear-gradient(135deg,var(--mari) 0 7px,var(--mari-2) 7px 14px);position:relative}
.ask-band svg{width:16px;height:16px}
.ask-band .right{margin-left:auto;font-weight:700;font-size:13px}
.ask-band.bad{background:var(--bad-soft);color:var(--bad);padding-right:16px}
.ask-body{padding:16px 18px 18px;display:grid;gap:12px}
.ask h3{font-size:19px;line-height:1.25;font-weight:800}
.ask .ctx{font-size:13.5px;color:var(--ink-2)}
.ask .ctx a,.linkish{color:var(--accent);font-weight:700;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}
.cmd{background:var(--pane);color:var(--pane-ink);font-family:var(--f-mono);font-size:13.5px;border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin:0;line-height:1.5}
.cmd .p{color:var(--pane-dim);user-select:none}
.ask-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.is-p .ask-actions .btn{min-height:52px;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;min-height:48px;cursor:pointer;font-weight:700}
.opt:hover{border-color:var(--accent)}
.opt b{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none;font-size:13px}
.opt small{display:block;font-weight:400;color:var(--ink-2)}
.replyrow{display:flex;gap:8px}
.replyrow input{flex:1;min-width:0}
.resolved{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.resolved svg{width:18px;height:18px;flex:none;margin-top:1px}
.resolved.ok svg{color:var(--good)} .resolved.no svg{color:var(--ink-3)}
details.raw summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:700}
details.raw pre{margin:8px 0 0}

/* inputs */
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:13.5px;font-weight:700}
.field small{color:var(--ink-3);font-size:12.5px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.is-p .inp{min-height:46px;font-size:16px}
.err{color:var(--bad);font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:flex-start}
.err svg{width:16px;height:16px;flex:none;margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}

/* lists */
.sec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:4px 2px 0}
.sec-h .faint{font-weight:500}
.rows{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-height:56px;cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{font-size:13px;color:var(--ink-3);white-space:nowrap}
.fold{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 2px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);min-height:44px}
.fold svg{width:18px;height:18px;transition:transform .15s}
.fold[aria-expanded="true"] svg{transform:rotate(90deg)}

/* glyphs */
.gl{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.gl svg{width:20px;height:20px}
.gl-router{background:var(--ink);color:var(--ground)}
.gl-cc{background:var(--accent-soft);color:var(--accent)}
.gl-cmd{background:var(--sunken);color:var(--ink-2)}
.gl-sm{width:26px;height:26px;border-radius:8px;font-size:11px}
.gl-sm svg{width:15px;height:15px}

/* phone chrome */
.p-head{display:flex;align-items:center;gap:8px;padding:6px 12px 10px 18px;flex:none}
.p-head h1{font-size:26px;font-weight:800;letter-spacing:-.01em;flex:1}
.p-head .sub{font-size:13px;color:var(--ink-2)}
.p-body{padding:4px 14px 20px;display:grid;gap:14px;align-content:start}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 6px 14px}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;font-weight:700;color:var(--ink-3);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .tpill{background:var(--accent-soft)}
.tpill{display:grid;place-items:center;width:56px;height:30px;border-radius:15px}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;font-size:11.5px}
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0}
.sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px 24px;max-height:88%;overflow-y:auto;display:grid;gap:14px;animation:up .2s ease-out}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:0}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet h2{font-size:20px;font-weight:800}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.menu{display:grid}
.menu button{display:flex;gap:14px;align-items:center;border:0;background:none;padding:0 4px;min-height:52px;font-weight:700;font-size:16px;cursor:pointer;border-top:1px solid var(--line);text-align:left}
.menu button:first-child{border-top:0}
.menu svg{width:22px;height:22px;color:var(--ink-2)}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;white-space:nowrap;box-shadow:var(--shadow)}
.is-d .toast{bottom:28px}

/* desktop chrome */
.d-shell{display:grid;grid-template-columns:216px 1fr;height:100%;min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 8px 14px}
.brand .gl{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:10px;padding:0 10px;min-height:40px;font-weight:700;cursor:pointer;color:var(--ink-2);text-align:left;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto}
.rail .recent{margin-top:14px;display:grid;gap:2px;overflow:hidden}
.rail .recent h2{font-size:12.5px;font-weight:700;color:var(--ink-3);padding:0 10px 4px}
.rail .recent button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left;color:var(--ink-2);min-width:0}
.rail .recent button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .recent button:hover{background:var(--surface-2);color:var(--ink)}
.rail .recent svg{width:12px;height:12px;flex:none}
.rail .grow{flex:1}
.d-main{display:grid;min-height:0;min-width:0}
.col{min-height:0;min-width:0;display:flex;flex-direction:column}
.col-head{padding:22px 28px 14px;display:flex;align-items:center;gap:12px;flex:none}
.col-head h1{font-size:24px;font-weight:800;flex:1}
.col-body{padding:0 28px 28px;display:grid;gap:16px;align-content:start}
.side{background:var(--surface-2);border-left:1px solid var(--line)}

/* thread */
.thread{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;padding:18px 16px 24px}
.thread>*{min-width:0}
.is-d .thread{padding:22px 32px 28px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg .who{font-size:12.5px;color:var(--ink-3);margin-bottom:4px;display:flex;gap:8px}
.msg .who b{color:var(--ink-2)}
.msg .body{min-width:0;flex:1}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:15px;line-height:1.55;min-width:0}
.bubble p+p,.bubble p+pre,.bubble pre+p{margin-top:8px}
.bubble code{font-family:var(--f-mono);font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:5px}
.bubble pre{background:var(--pane);color:var(--pane-ink);border-radius:10px;padding:10px 12px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;margin:0;line-height:1.5}
.bubble pre code{background:none;padding:0;color:inherit}
.tok-k{color:#8FD3F2}.tok-s{color:#F8C75A}.tok-n{color:#B7E3A1}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:16px 4px 16px 16px;max-width:82%}
.msg.me .body{flex:0 1 auto;display:grid;justify-items:end;max-width:86%}
.msg.me.queued .bubble{background:transparent;color:var(--ink);border:1.5px dashed var(--accent)}
.sys{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;padding-left:44px}
.sys svg{width:15px;height:15px;color:var(--ink-3)}
.cmdres .bubble{padding:0;overflow:hidden}
.cmdres .cap{padding:9px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.cmdres .cap .exit{margin-left:auto;font-family:var(--f-mono);font-weight:700;color:var(--good)}
.cmdres pre{border-radius:0}
.turn{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.turn-top{display:flex;align-items:center;gap:10px;font-weight:800}
.turn-top .el{margin-left:auto;font-weight:700;color:var(--ink-2)}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stages li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-3)}
.stages li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
.stages li.done{color:var(--ink-2)} .stages li.done i{background:var(--ink-3);border-color:var(--ink-3)}
.stages li.now{color:var(--ink);font-weight:700} .stages li.now i{border-color:var(--accent);background:var(--accent)}
.turn-actions{display:flex;flex-wrap:wrap;gap:8px}
.attach{display:grid;gap:6px}
.attach code{display:block;background:var(--pane);color:var(--pane-ink);font-family:var(--f-mono);font-size:12.5px;padding:10px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;user-select:all}
.attach .row2{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.pane{background:var(--pane);color:var(--pane-ink);font-family:var(--f-mono);font-size:12.5px;line-height:1.55;border-radius:12px;padding:10px 12px;overflow:hidden;display:grid;gap:0;align-content:end}
.pane div{white-space:pre-wrap;word-break:break-word}
.pane .dim{color:var(--pane-dim)} .pane .hi{color:var(--pane-hi)}
.pane-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.errcard{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:14px}
.errcard b{color:var(--bad)}
.composer{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:10px 12px 14px;display:grid;gap:6px}
.is-d .composer{padding:14px 32px 18px}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 14px;line-height:1.4;max-height:150px;font-size:15px}
.is-p .comp-row textarea{font-size:16px}
.comp-row textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.comp-hint{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.comp-hint.busy{color:var(--accent);font-weight:700}
.comp-hint svg{width:15px;height:15px;flex:none}
.t-head{flex:none;display:flex;align-items:center;gap:8px;padding:4px 8px 10px;border-bottom:1px solid var(--line)}
.t-head .ttl{flex:1;min-width:0}
.t-head h1{font-size:16.5px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-head .sub{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.is-d .t-head{padding:18px 32px 14px}
.is-d .t-head h1{font-size:20px}
.ctxsec{display:grid;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.ctxsec h2{font-size:14px;font-weight:800}
.task{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .top{display:flex;gap:10px;align-items:center}
.task .top b{flex:1;font-size:14px}
.task .acts{display:flex;gap:4px;margin-left:36px}
.empty{display:grid;gap:12px;justify-items:start;padding:32px 6px}
.empty h2{font-size:22px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:36px;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:700}
.is-p .chip{min-height:40px}

/* machines */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.thead{display:flex;gap:12px;align-items:center;padding:14px;border:0;background:none;width:100%;text-align:left;cursor:pointer;min-height:64px}
.thead .main{flex:1;min-width:0}
.thead b{font-size:17px}
.thead .s{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead>svg{width:20px;height:20px;color:var(--ink-3);transition:transform .15s;flex:none}
.thead[aria-expanded="true"]>svg{transform:rotate(90deg)}
.tbody{padding:0 14px 16px;display:grid;gap:18px}
.sect{display:grid;gap:10px}
.sect>h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:14px}
.facts div{display:grid}
.facts span{font-size:12.5px;color:var(--ink-3)}
.facts b{font-variant-numeric:tabular-nums}
.is-d .facts{grid-template-columns:repeat(4,minmax(0,1fr))}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.plain li{display:flex;gap:8px;align-items:flex-start}
.plain svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--ink-3)}
.plain li.yes svg{color:var(--good)} .plain li.no svg{color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--sunken);border-radius:12px;padding:4px}
.is-d .seg{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-2);min-height:44px;line-height:1.2}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.relay-why{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.keybox{border:1.5px solid var(--mari);background:var(--mari-soft);border-radius:14px;padding:14px;display:grid;gap:12px}
.keybox.ok{border-color:var(--line);background:var(--surface-2)}
.keybox h4{margin:0;font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center;color:var(--mari-ink)}
.keybox.ok h4{color:var(--good)}
.keybox h4 svg{width:18px;height:18px}
.keybox p{font-size:13.5px}
.keys{display:grid;gap:8px}
.key{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.key:has(input:checked){border-color:var(--accent)}
.key input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.key .fp{font-family:var(--f-mono);font-size:12.5px;word-break:break-all;color:var(--ink-2)}
.ws{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ws:first-child{border-top:0}
.ws .main{flex:1 1 160px;min-width:0}
.ws .main b{display:block}
.ws .acts{display:flex;gap:6px;flex-wrap:wrap}
.confirm{flex-basis:100%;background:var(--bad-soft);border-radius:10px;padding:10px 12px;display:grid;gap:8px;font-size:14px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.tlist .row .t{font-size:15px}
.tlist .row[aria-current="true"]{background:var(--accent-soft)}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;margin:0}
.form legend{font-weight:800;font-size:14px;padding:0 6px}
.form .acts{display:flex;gap:8px;flex-wrap:wrap}

/* vault */
.cred{display:grid;gap:8px;padding:14px;border-top:1px solid var(--line)}
.cred:first-child{border-top:0}
.cred .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cred .name{font-family:var(--f-mono);font-weight:700;font-size:15px;word-break:break-all}
.scope{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--sunken);color:var(--ink-2)}
.scope.all{background:var(--accent-soft);color:var(--accent)}
.cred .acts{display:flex;gap:6px;flex-wrap:wrap}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.lock svg{width:14px;height:14px}

/* login */
.login{flex:1;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.login .mark{position:absolute;right:-120px;bottom:-140px;width:520px;opacity:.07;color:var(--ink);pointer-events:none}
.login-card{width:100%;max-width:380px;display:grid;gap:18px;position:relative}
.login-card h1{font-size:30px;font-weight:800;display:flex;gap:12px;align-items:center}
.login-card .gl{width:44px;height:44px;border-radius:14px}
.login-card .gl svg{width:26px;height:26px}
.back-to{font-size:14px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.back-to b{color:var(--ink)}
.is-d .login-card{background:var(--surface);padding:32px;border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.dev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dev:first-child{border-top:0}
.dev .main{flex:1;min-width:0}
.dev .main b{display:block}
.modal-wrap{position:absolute;inset:0;z-index:20;display:grid;place-items:center}
.modal{position:relative;background:var(--surface);border-radius:18px;padding:22px;width:480px;max-height:90%;overflow:auto;display:grid;gap:14px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- the weave (ported from direction C into Shuttle's palette) ---------- */
.today-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.today-head h1{flex:0 0 auto}
.today-head .sum{flex:1 1 220px;color:var(--ink-2);font-size:14px;min-width:0}
.daypick{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.daypick button{border:0;background:none;border-radius:9px;min-height:34px;padding:0 10px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.daypick button svg{width:16px;height:16px}
.daypick button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.daypick button[disabled]{opacity:.35;cursor:default}
.daypick .date{padding:0 10px;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.is-p .daypick button{min-height:40px}
.weave-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;display:grid;gap:8px;position:relative}
.weave-card h2{font-size:15px;font-weight:800;display:flex;gap:10px;align-items:baseline}
.weave-card h2 small{font-weight:500;color:var(--ink-3);font-size:12.5px}
.weave-wrap{position:relative;overflow:hidden}
.wv{display:block;overflow:visible;max-width:100%}
.wv text{font-family:var(--f-ui)}
.wv .h{font-size:11.5px;fill:var(--ink-3)}
.wv .m{font-size:13px;font-weight:800;fill:var(--ink)}
.wv .w{font-size:12.5px;fill:var(--ink-2)}
.wv .w.dim{fill:var(--ink-3)}
.wv .band{fill:var(--surface-2)}
.wv .band.dim{opacity:.55}
.wv .warp{stroke:var(--line);stroke-width:1}
.wv .warp.hr{stroke:var(--ink-3);stroke-opacity:.45}
.wv .weft{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;stroke-opacity:.8}
.wv .wait{fill:none;stroke:var(--mari);stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round}
.wv .span{stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.wv .thread{cursor:pointer}
.wv .thread:hover .weft,.wv .thread.hl .weft{stroke:var(--accent);stroke-opacity:1;stroke-width:3}
.wv .thread.hl .span{stroke:var(--accent-hover)}
.wv .nowline{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3}
.wv .nowlbl{font-size:11.5px;font-weight:800;fill:var(--ink)}
.wv .edge{font-size:11px;fill:var(--mari-ink);font-weight:700}
.wv .st-g{cursor:pointer}
.wv .st-g:focus{outline:none}
.wv .halo{fill:none;stroke:var(--focus);stroke-width:2.5;opacity:0}
.wv .st-g:focus-visible .halo,.wv .st-g:hover .halo{opacity:1}
.wv .k-need{fill:var(--mari);stroke:var(--surface);stroke-width:1.5}
.wv .k-need-o{fill:var(--surface);stroke:var(--mari);stroke-width:2.2}
.wv .k-ring{fill:none;stroke:var(--mari);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.wv .pulse1 .k-ring{animation:knot 1.8s ease-out .6s 1 both}
@keyframes knot{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.3)}}
.wv .k-x{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.wv .k-xbg{fill:var(--surface)}
.wv .k-xdone{stroke:var(--ink-3);stroke-width:2.4;stroke-linecap:round}
.wv .k-done{fill:var(--ink-3)}
.wv .k-cmd{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.6}
.wv .k-ans{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.8}
.wv .k-route{fill:var(--ink-3)}
.wv .k-prov{stroke:var(--ink-2);stroke-width:2;stroke-linecap:round}
.wv .k-hit{fill:transparent}
.wv .shut{fill:var(--accent);stroke:var(--surface);stroke-width:1.2}
.wv .shut-hole{fill:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:22px;height:14px;flex:none}
.wtip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12.5px;font-weight:700;line-height:1.35;padding:7px 10px;border-radius:9px;max-width:300px;box-shadow:var(--shadow);transform:translate(-50%,calc(-100% - 12px))}
.wtip small{display:block;font-weight:400;opacity:.8}
/* desktop inbox day strip */
.daystrip{display:flex;align-items:center;gap:14px;padding:10px 28px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;position:relative}
.daystrip .ds-lbl{display:grid;gap:2px;flex:none;width:96px}
.daystrip .ds-lbl b{font-size:14px;font-weight:800}
.daystrip .ds-lbl span{font-size:12px;color:var(--ink-3)}
.daystrip .ds-svg{flex:1;min-width:0}
.daystrip .ds-open{flex:none}
.daystrip .note{position:absolute;right:28px;top:calc(100% + 8px);white-space:nowrap;z-index:3}
.ds .ml{font-size:11px;fill:var(--ink-3);font-weight:700}
.ds .row{fill:var(--surface-2)}
.ds .span{stroke:var(--accent);stroke-width:6;stroke-linecap:round}
.ds .wait{stroke:var(--mari);stroke-width:1.6;stroke-dasharray:2 3}
.ds .nowline{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2}
.ds .k-need{fill:var(--mari);stroke:var(--surface);stroke-width:1.2}
.ds .k-x{stroke:var(--bad);stroke-width:2.6;stroke-linecap:round}
.ds .knotbtn{cursor:pointer}
.ds .knotbtn:focus{outline:none}
.ds .knotbtn:focus-visible .halo,.ds .knotbtn:hover .halo{opacity:1}
.ds .halo{fill:none;stroke:var(--focus);stroke-width:2;opacity:0}
.ds .sel .halo{opacity:1;stroke:var(--accent)}
/* phone inbox mini strip */
.pstrip{display:grid;gap:4px;border:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px 7px;cursor:pointer;text-align:left;width:100%}
.pstrip .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-weight:700}
.pstrip .top b{color:var(--ink);font-weight:800}
.pstrip svg{display:block;width:100%;height:24px}
.pstrip .note{margin-top:4px}
/* phone vertical timeline */
.vt{display:grid;gap:0;position:relative}
.vt-now{display:grid;grid-template-columns:50px 1fr;align-items:center;font-size:12.5px;font-weight:800;margin-bottom:6px}
.vt-now i{display:block;border-top:1.5px dashed var(--ink)}
.vt-row{display:grid;grid-template-columns:50px 22px minmax(0,1fr);gap:0;align-items:stretch;border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%;color:inherit}
.vt-row time{font-size:12.5px;color:var(--ink-3);padding-top:14px;font-variant-numeric:tabular-nums}
.vt-row .ln{position:relative;display:flex;justify-content:center}
.vt-row .ln::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.vt-row .ln svg{position:relative;width:16px;height:16px;margin-top:15px;background:var(--ground);border-radius:4px}
.vt-card{margin:5px 0;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:5px;min-width:0}
.vt-card.need{border-color:var(--mari);box-shadow:inset 4px 0 0 var(--mari)}
.vt-card .t{font-weight:700;font-size:14.5px;line-height:1.3}
.vt-card .what{font-size:13px;color:var(--ink-2)}
.lanechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:2px 9px 2px 4px;justify-self:start;max-width:100%}
.lanechip i{width:14px;height:4px;border-radius:2px;background:var(--lc,var(--ink-3));flex:none}
.lanechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt-steps{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink-3)}
.vt-steps span{display:inline-flex;gap:4px;align-items:center}
.vt-steps svg{width:12px;height:12px}
/* all conversations */
.searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchrow .inp{flex:1 1 220px;min-width:0}
.convrow .pv{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convrow .meta2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--ink-3)}
/* conversation read-back: margin rail */
.tgroup{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;scroll-margin-top:12px;border-radius:14px}
.is-d .tgroup{grid-template-columns:138px minmax(0,1fr);gap:18px}
.tgroup .tg-body{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.tgroup.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.mrail{list-style:none;margin:0;padding:2px 0 0;display:grid;gap:0;align-content:start;align-self:start;position:sticky;top:8px}
.mrail li{position:relative;padding:0 0 10px 20px;font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.mrail li::before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.mrail li:last-child::before{display:none}
.mrail li svg{position:absolute;left:0;top:1px;width:14px;height:14px}
.mrail li time{display:block;color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.mrail li.need{color:var(--mari-ink);font-weight:700}
.mrail li.bad{color:var(--bad);font-weight:700}
.mrail button{all:unset;cursor:pointer;display:block;border-radius:4px}
.mrail button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.istep{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--ink-3);padding-left:4px}
.istep span{display:inline-flex;gap:5px;align-items:center}
.istep svg{width:12px;height:12px;flex:none}
.istep .need{color:var(--mari-ink);font-weight:700}
.istep .bad{color:var(--bad);font-weight:700}
details.steps{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.steps summary{cursor:pointer;font-weight:800;font-size:14px;min-height:28px;display:flex;align-items:center}
details.steps ol{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:2px}

const hhmm = m => { m = Math.floor(m); return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };

function convStatus(id){

        {t:801, lane:"ledger-api", k:"cmd", label:"Command on atlas: npm test, exit 0", anchor:"g2"},
        {t:820, lane:"ledger-api", k:"route", label:"Routed to kestrel for the staging database", anchor:"g3"},
        {t:822, lane:"infra-terraform", k:"ans", label:"Offer approved: psql migration on kestrel", anchor:"g3"},
        {t:823.6, lane:"infra-terraform", k:"cmd", label:"Command on kestrel: psql, exit 0", anchor:"g3"},
        {t:830, lane:"ledger-api", k:"failr", label:"Failed: couldn't reach atlas. Retried at 13:58", anchor:"g4"},

    else {
      th.marks.push({t:866, lane:"ledger-api", k:"ans", label:`You answered ${p.answer}`, anchor:"g6"});

    }
    T.push(th);
  }
  // Restart the staging deploy: an offer on kestrel.
  {

    const th = {conv:"restart", dy:7, path:[[869,"infra-terraform"]], spans:[], marks:[{t:869, lane:"infra-terraform", k:"route", label:"Routed to kestrel", anchor:"g1"}], end:870};

    else {

}

const STAGES = {
  prompt:["Queued","Deciding where this goes…","claude-code is working in ledger-api"],

};
let turnSeq = 0;
const paneTimers = {};
function startTurn(cid, kind){
  const cs = S.cs[cid], id = ++turnSeq;
  cs.turn = {id, kind, stage:0, since:Date.now(), pane:[]};
  render();
  const live = () => cs.turn && cs.turn.id === id;
  setTimeout(() => { if(live()){ cs.turn.stage = 1; render(); } }, 900);
  setTimeout(() => {
    if(!live()) return;
    cs.turn.stage = 2; render();
    const lines = PANE_LIVE[kind];
    if(lines){
      let n = 0; clearInterval(paneTimers[cid]);
      paneTimers[cid] = setInterval(() => {
        if(!live()){ clearInterval(paneTimers[cid]); return; }
        cs.turn.pane.push(lines[n++]); paintPane();
        if(n >= lines.length){ clearInterval(paneTimers[cid]); setTimeout(() => live() && finishTurn(cid), 1400); }
      }, 1100);
    } else setTimeout(() => live() && finishTurn(cid), 2600);
  }, 2400);
}
function finishTurn(cid){
  const cs = S.cs[cid], t = cs.turn; cs.turn = null; clearInterval(paneTimers[cid]);
  const at = nowM();
  if(t.kind === "prompt"){
    S.inbox.prompt.doneAt = at;
    cs.extra.push({who:"cc", t:at, html:`<p>The limit now comes from <code>LEDGER_RATE_LIMIT</code> and defaults to 20 a minute. A key over it still gets a 429 with <code>Retry-After</code>.</p><p>All 47 transfer tests pass.</p>`, steps:[{k:"turn", label:"Agent turn", t:S.inbox.prompt.at},{k:"done", label:"claude-code replied", t:at}]});
  } else if(t.kind === "cmd"){
    S.inbox.offer.doneAt = at;
    cs.extra.push({who:"cmd", t:at, cmd:"kubectl -n staging rollout restart deploy/ledger-api", out:`deployment.apps/ledger-api restarted\ndeployment "ledger-api" successfully rolled out`, steps:[{k:"cmd", label:"Command on kestrel, exit 0", t:at}]});
  } else {
    cs.extra.push({who:"router", t:at, html:`<p>This is a mockup, so nothing went to the fleet. In the real client the answer to your message lands here.</p>`, steps:[{k:"done", label:"Loomux answered", t:at}]});
  }
  if(cs.queued){ const q = cs.queued; cs.queued = null; cs.extra.push({who:"me", t:nowM(), text:q}); render(); startTurn(cid, "plain"); return; }
  render();
}
function cancelTurn(cid){
  const cs = S.cs[cid]; if(!cs.turn) return;
  const kind = cs.turn.kind; cs.turn = null; clearInterval(paneTimers[cid]);
  cs.extra.push({err:true, kind, t:nowM(), steps:[{k:"failr", label:"You cancelled the turn", t:nowM()}]});
  render();
}
function paintPane(){ document.querySelectorAll("[data-pane]").forEach(el => { el.innerHTML = paneLines(el.dataset.pane); }); }
function paneLines(cid){
  const cs = S.cs[cid];
  const lines = cs && cs.turn ? cs.turn.pane : (PANE_LAST[cid] || [["dim","No pane yet."]]);
  if(!lines.length) return `<div class="dim">Waiting for the agent's first output…</div>`;
  return lines.slice(-12).map(([c,t]) => `<div class="${c==="bad"?"hi":c}">${esc(t)}</div>`).join("");
}

// One answer path for each needs-you item, used by the inbox card, the thread and the weave.
function answerOffer(v){
  const o = S.inbox.offer; if(o.state !== "pending") return;
  o.state = v; o.at = nowM();
  const cs = S.cs.restart;
  cs.extra.push({who:"me", t:o.at, text: v === "approved" ? "yes" : "no", steps:[{k:"ans", label: v === "approved" ? "Offer approved" : "Offer denied", t:o.at}]});
  if(v === "approved") startTurn("restart", "cmd");
  else cs.extra.push({who:"router", t:o.at, html:"<p>Okay, nothing was run. Ask again whenever you want the restart.</p>"});
}
function answerPrompt(v){
  const p = S.inbox.prompt; if(p.state !== "pending") return;
  p.state = "answered"; p.answer = v; p.at = nowM();
  S.cs.ratelimit.extra.push({who:"me", t:p.at, text:v, steps:[{k:"ans", label:"You answered", t:p.at}]});
  startTurn("ratelimit", "prompt");
}

  const rows = S.creds.map(c => {
    let extra = "";

    return `<div class="cred"><div class="top"><span class="name">${esc(c.name)}</span><span class="lock">${ic("lock")}Value hidden</span></div><div class="chips">${scopeChips(c)}</div>

}

// ---------- the weave ----------
const NEED_ITEM = {restart:"restart", ratelimit:"ratelimit", tf:"tf", nb:"nb"};
function dayAxis(day){ return day === "today" ? [480, Math.max(900, Math.ceil((nowM()+12)/30)*30)] : [480, 1200]; }
function markShape(m, x, y, pulse){
  const k = m.k;
  if(k === "need") return `<g class="${pulse?"pulse1":""}"><circle class="k-ring" cx="${x}" cy="${y}" r="10"/><path class="k-need" d="M${x} ${y-8}l8 8-8 8-8-8z"/></g>`;
  if(k === "needo") return `<path class="k-need-o" d="M${x} ${y-7}l7 7-7 7-7-7z"/>`;
  if(k === "fail") return `<circle class="k-xbg" cx="${x}" cy="${y}" r="8"/><path class="k-x" d="M${x-5} ${y-5}l10 10M${x+5} ${y-5}l-10 10"/>`;
  if(k === "failr") return `<circle class="k-xbg" cx="${x}" cy="${y}" r="6"/><path class="k-xdone" d="M${x-3.5} ${y-3.5}l7 7M${x+3.5} ${y-3.5}l-7 7"/>`;
  if(k === "done") return `<rect class="k-done" x="${x-4.5}" y="${y-4.5}" width="9" height="9" rx="2"/>`;
  if(k === "cmd") return `<rect class="k-cmd" x="${x-4.5}" y="${y-4.5}" width="9" height="9" rx="2"/>`;
  if(k === "ans") return `<path class="k-ans" d="M${x} ${y-6}l6 6-6 6-6-6z"/>`;
  if(k === "prov") return `<path class="k-prov" d="M${x} ${y-5}v10M${x-5} ${y}h10"/>`;
  return `<circle class="k-route" cx="${x}" cy="${y}" r="3.5"/>`;
}
function weaveSVG(W, day){
  const labelW = 188, top = 34, laneH = 34, gap = 12, right = 22;
  const [start, end] = dayAxis(day), now = nowM(), isToday = day === "today";
  const X = t => labelW + (Math.max(start, Math.min(end, t)) - start) / (end - start) * (W - labelW - right);
  const L = {}; let y = top, prev = null;
  LANES.forEach((l, i) => { if(i > 0 && l.m !== prev) y += gap; prev = l.m; L[l.id] = {...l, top:y, y:y + laneH/2, first: i === 0 || LANES[i-1].m !== l.m}; y += laneH; });
  const H = y + 6;
  const threads = isToday ? todayThreads() : yesterdayThreads();
  let s = `<svg class="wv" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="${isToday ? "Today" : "Yesterday"} from 08:00 to ${isToday ? "now" : "20:00"}: one lane per workspace, grouped by machine. Marigold diamonds are waiting on you. Use Tab to reach a stitch and the arrow keys to move along a lane.">`;
  Object.values(L).forEach(l => {
    s += `<rect class="band${l.dim ? " dim" : ""}" x="${labelW - 10}" y="${l.top + 3}" width="${W - labelW + 10 - right + 12}" height="${laneH - 6}" rx="7"/>`;
    if(l.first && l.m) s += `<text class="m" x="0" y="${l.y + 4}">${esc(MACHINE_NAME[l.m])}</text>`;
    s += `<text class="w${l.dim ? " dim" : ""}" x="${l.id === "router" ? 0 : 76}" y="${l.y + 4}">${esc(l.name || l.id)}</text>`;
  });
  for(let m = start; m <= end; m += 15){
    const x = X(m).toFixed(1);
    s += `<line class="warp${m % 60 === 0 ? " hr" : ""}" x1="${x}" x2="${x}" y1="${top - 4}" y2="${H - 4}"/>`;
    if(m % 60 === 0) s += `<text class="h" x="${x}" y="14" text-anchor="middle">${hhmm(m)}</text>`;
  }
  const ly = (th, lane) => L[lane].y + (lane === "router" ? 0 : (th.dy || 0));
  threads.forEach(th => {
    const p = th.path, endT = Math.min(th.end, isToday ? now : end);
    let d, x0 = X(p[0][0]);
    if(th.edge || p[0][1] === "router") d = `M${x0.toFixed(1)} ${ly(th, p[0][1])}`;
    else { const ry = L.router.y; x0 = X(p[0][0] - 8); const x1 = X(p[0][0]), xm = (x0 + x1)/2; d = `M${x0.toFixed(1)} ${ry} C${xm.toFixed(1)} ${ry} ${xm.toFixed(1)} ${ly(th,p[0][1])} ${x1.toFixed(1)} ${ly(th,p[0][1])}`; }
    for(let k = 1; k < p.length; k++){
      const [t, lane] = p[k], ya = ly(th, p[k-1][1]), yb = ly(th, lane), xa = X(t - 2), xb = X(t + 3), xm = (xa + xb)/2;
      d += ` H${xa.toFixed(1)} C${xm.toFixed(1)} ${ya} ${xm.toFixed(1)} ${yb} ${xb.toFixed(1)} ${yb}`;
    }
    d += ` H${X(endT).toFixed(1)}`;
    s += `<g class="thread${S.hl === th.conv ? " hl" : ""}" data-act="open" data-arg="${th.conv}"><title>${esc(CONVS[th.conv].title)}</title><path class="weft" d="${d}"/>`;
    th.spans.forEach(([a, b, lane]) => { const xa = X(a), xb = Math.max(xa + 1, X(Math.min(b, isToday ? now : end))); s += `<line class="span" x1="${xa.toFixed(1)}" x2="${xb.toFixed(1)}" y1="${ly(th,lane)}" y2="${ly(th,lane)}"/>`; });
    s += `</g>`;
    if(th.wait){ const yy = ly(th, th.wait.lane); s += `<line class="wait" x1="${X(th.wait.from).toFixed(1)}" x2="${X(isToday ? now : end).toFixed(1)}" y1="${yy}" y2="${yy}"/>`; }
    if(th.edge){ s += `<text class="edge" x="${X(start) + 4}" y="${ly(th, th.wait.lane) - 8}">Waiting for your reply ${esc(th.edge)}</text>`; }
  });
  threads.forEach(th => {
    th.marks.forEach(m => {
      const x = +X(m.t).toFixed(1), yy = ly(th, m.lane);
      const waiting = (m.k === "need" || m.k === "fail" || m.k === "needo") && isToday ? `, waiting ${ago(m.t)}` : "";
      const tip = `${hhmm(m.t)} ${m.label}${waiting}`;
      s += `<g class="st-g" tabindex="0" role="button" data-act="stitch" data-arg="${th.conv}|${m.anchor}" data-lane="${LANES.findIndex(l => l.id === m.lane)}" data-t="${m.t}" data-tip="${esc(tip)}" data-sub="${esc(CONVS[th.conv].title)}" aria-label="${esc(tip)}. ${esc(CONVS[th.conv].title)}. Open the conversation at this turn.">
        <circle class="k-hit" cx="${x}" cy="${yy}" r="11"/><circle class="halo" cx="${x}" cy="${yy}" r="11"/>${markShape(m, x, yy, S.pulse)}</g>`;
    });
    if(th.running && isToday){ const x = X(now), yy = ly(th, th.running);
      s += `<g class="st-g" tabindex="0" role="button" data-act="open" data-arg="${th.conv}" data-lane="${LANES.findIndex(l => l.id === th.running)}" data-t="${now}" data-tip="${esc("Working now in " + th.running)}" data-sub="${esc(CONVS[th.conv].title)}" aria-label="Working now: ${esc(CONVS[th.conv].title)}"><circle class="halo" cx="${x}" cy="${yy}" r="12"/><path class="shut" d="M${x-13} ${yy}c4-5 8.5-7 13-7s9 2 13 7c-4 5-8.5 7-13 7s-9-2-13-7z"/><rect class="shut-hole" x="${x-4.5}" y="${yy-1.6}" width="9" height="3.2" rx="1.6"/></g>`; }
  });
  if(isToday){ const xn = X(now).toFixed(1); s += `<line class="nowline" x1="${xn}" x2="${xn}" y1="${top - 12}" y2="${H - 2}"/><text class="nowlbl" x="${xn}" y="28" text-anchor="middle">now ${hhmm(now)}</text>`; }
  return s + `</svg>`;
}

// Desktop inbox: the day compressed to one row per machine.
function dayStripSVG(W){
  const [start, end] = dayAxis("today"), now = nowM(), lab = 64, rowH = 14, gapY = 4;
  const X = t => lab + (Math.max(start, Math.min(end, t)) - start) / (end - start) * (W - lab - 8);
  const rows = ["atlas","kestrel","local"], T = todayThreads();
  let s = `<svg class="ds" viewBox="0 0 ${W} 60" width="100%" height="60" role="group" aria-label="Today on each machine. Diamonds are waiting on you; select one to show it in the inbox.">`;
  rows.forEach((m, r) => {
    const y = r * (rowH + gapY), cy = y + rowH/2;
    s += `<text class="ml" x="0" y="${cy + 4}">${esc(MACHINE_NAME[m])}</text><rect class="row" x="${lab - 4}" y="${y}" width="${W - lab - 2}" height="${rowH}" rx="7"/>`;
    T.forEach(th => {
      th.spans.forEach(([a, b, lane]) => { if(laneOf(lane).m === m) s += `<line class="span" x1="${X(a).toFixed(1)}" x2="${Math.max(X(a)+1, X(Math.min(b, now))).toFixed(1)}" y1="${cy}" y2="${cy}"/>`; });
      if(th.wait && laneOf(th.wait.lane).m === m && !th.edge) s += `<line class="wait" x1="${X(th.wait.from).toFixed(1)}" x2="${X(now).toFixed(1)}" y1="${cy}" y2="${cy}"/>`;
    });
    T.forEach(th => th.marks.filter(k => k.need && laneOf(k.lane).m === m).forEach(k => {
      const x = X(k.t).toFixed(1), item = NEED_ITEM[k.need], tip = `${hhmm(k.t)} ${k.label}, waiting ${ago(k.t)}`;
      s += `<g class="knotbtn${S.sel === item ? " sel" : ""}" tabindex="0" role="button" data-act="dsknot" data-arg="${item}" data-tip="${esc(tip)}" data-sub="${esc(CONVS[th.conv].title)}" aria-label="${esc(tip)}. Show it in the inbox."><circle class="halo" cx="${x}" cy="${cy}" r="9"/>${k.k === "fail" ? `<path class="k-x" d="M${x-4.5} ${cy-4.5}l9 9M${+x+4.5} ${cy-4.5}l-9 9"/>` : `<path class="k-need" d="M${x} ${cy-7}l7 7-7 7-7-7z"/>`}</g>`;
    }));
  });
  const xn = X(now).toFixed(1);
  s += `<line class="nowline" x1="${xn}" x2="${xn}" y1="0" y2="${3*(rowH+gapY)-gapY}"/>`;
  for(let m = start; m <= end; m += 120) s += `<text class="ml" x="${X(m).toFixed(1)}" y="58" text-anchor="middle" style="font-weight:400">${hhmm(m)}</text>`;
  return s + `</svg>`;
}

}

// Phone Today: the same day as a vertical timeline, newest first.
const LANE_COLOR = {"ledger-api":"var(--lane-1)", "infra-terraform":"var(--lane-2)", "blog-rewrite":"var(--lane-3)", "ml-notebook":"var(--lane-4)", router:"var(--ink-3)"};
function vTimeline(day){
  const isToday = day === "today", T = isToday ? todayThreads() : yesterdayThreads();
  const clusters = [];
  T.forEach(th => {
    const by = {};
    th.marks.forEach(m => { const key = m.anchor === "x-end" ? "g-late" : m.anchor; (by[key] = by[key] || []).push(m); });
    Object.values(by).forEach(ms => clusters.push({conv:th.conv, ms, t:Math.max(...ms.map(m => m.t)), lane:ms[ms.length-1].lane, anchor:ms[0].anchor}));
    if(th.running && isToday) clusters.push({conv:th.conv, ms:[{k:"work", label:`Working now in ${th.running}`, t:nowM()}], t:nowM(), lane:th.running, anchor:"x-turn", work:true});
    if(th.edge && isToday) clusters.push({conv:th.conv, ms:[{k:"needo", label:`Waiting for your reply ${th.edge}`, t:480, need:"nb"}], t:479, lane:th.wait.lane, anchor:"g1", edge:true});
  });
  clusters.sort((a, b) => b.t - a.t);
  const pri = ["need","fail","needo","work","failr","ans","cmd","done","prov","route"];
  return `<div class="vt">${isToday ? `<div class="vt-now"><span class="tnum">${hhmm(nowM())}</span><i></i></div>` : ""}${clusters.map(c => {
    const top = pri.find(k => c.ms.some(m => m.k === k)) || "route", need = c.ms.some(m => m.need && (m.k === "need" || m.k === "fail" || m.k === "needo"));
    const ln = laneOf(c.lane), last = c.ms[c.ms.length-1];
    return `<button class="vt-row" data-act="stitch" data-arg="${c.conv}|${c.anchor}"><time>${c.edge ? "Yest." : hhmm(c.t)}</time><span class="ln">${si(top)}</span>
      <span class="vt-card${need ? " need" : ""}"><span class="t">${esc(CONVS[c.conv].title)}</span><span class="what">${esc(last.label)}</span>
      <span class="lanechip" style="--lc:${LANE_COLOR[c.lane] || "var(--ink-3)"}"><i></i><span>${c.lane === "router" ? "Answered by Loomux" : `${esc(c.lane)} on ${esc(MACHINE_NAME[ln.m])}`}</span></span>
      ${c.ms.length > 1 ? `<span class="vt-steps">${c.ms.slice(0,-1).map(m => `<span>${si(m.k)}${esc(m.label)}</span>`).join("")}</span>` : ""}</span></button>`;
  }).join("")}</div>`;
}

// All conversations (Today's list half; replaces the old Conversations section).
function convList(dev){
  const f = S.filter, q = S.search.trim().toLowerCase();
  const groups = {all:null, you:["approval","asking","waiting","failed"], running:["working"], done:["done"]};
  const ids = Object.keys(CONVS).filter(id => {
    const c = CONVS[id], s = convStatus(id);
    if(groups[f] && !groups[f].includes(s)) return false;
    return !q || (c.title + " " + c.preview + " " + c.ws + " " + (MACHINE_NAME[c.m]||"")).toLowerCase().includes(q);
  });
  const rank = {approval:0, asking:0, failed:1, waiting:2, working:3, done:4};

function render(){

    const root = document.getElementById("frame-"+dev);
    if(!root) continue;
    const ae = document.activeElement, fid = ae && root.contains(ae) ? ae.id : null;
    let sel = null; try { if(fid && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch(e){}
    const saved = {};
    root.querySelectorAll("[data-sk]").forEach(el => { saved[el.dataset.sk] = {top:el.scrollTop, bottom:el.scrollHeight - el.scrollTop - el.clientHeight < 40}; });
    root.innerHTML = dev === "p" ? phoneApp() : deskApp();
    root.querySelectorAll("[data-sk]").forEach(el => {
      const s = saved[el.dataset.sk];
      if(!s){ if(el.dataset.sk === "thread") el.scrollTop = el.scrollHeight; return; }
      el.scrollTop = s.bottom && el.dataset.sk === "thread" ? el.scrollHeight : s.top;
    });
    if(S.jump){
      const g = root.querySelector(`[data-anchor="${S.jump}"]`), sc = root.querySelector('[data-sk="thread"]');
      if(sc){ if(g){ sc.scrollTop = Math.max(0, g.offsetTop - sc.offsetTop - 12); g.classList.add("flash"); } else sc.scrollTop = sc.scrollHeight; }
    }
    if(S.scrollSel){
      const c = root.querySelector(`[data-selid="${S.scrollSel}"]`), sc = c && c.closest("[data-sk]");
      if(c && sc) sc.scrollTop = Math.max(0, c.offsetTop - sc.offsetTop - 8);
    }
    if(fid){ const el = document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
  }
  S.jump = null; S.scrollSel = null;
}
let lastMinute = Math.floor(nowM());
function tick(){
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach(el => el.textContent = fmtElapsed(now - +el.dataset.since));
  document.querySelectorAll("[data-until]").forEach(el => el.textContent = fmtCount(+el.dataset.until - now));
  let dirty = false;
  if(S.inbox.offer.state === "pending" && now >= S.inbox.offer.exp){ S.inbox.offer.state = "expired"; S.inbox.offer.at = nowM(); dirty = true; }
  for(const k in S.scan){ const sc = S.scan[k]; if(sc && sc.exp && !sc.expired && now >= sc.exp){ sc.expired = true; dirty = true; } }
  // The weave's now line moves once a minute, unless someone is mid-way through a stitch or a field.
  const m = Math.floor(nowM()), busy = document.activeElement && document.activeElement.closest && document.activeElement.closest(".st-g, .knotbtn, input, textarea, select");
  if(m !== lastMinute && !busy && ["inbox","today"].includes(S.screen)){ lastMinute = m; dirty = true; }
  if(dirty) render();
}

function showTip(el){
  const wrap = el.closest(".weave-wrap"); if(!wrap) return;
  let tip = wrap.querySelector(".wtip"); if(!tip){ tip = document.createElement("div"); tip.className = "wtip"; tip.setAttribute("aria-hidden","true"); wrap.appendChild(tip); }
  const wr = wrap.getBoundingClientRect(), r = el.getBoundingClientRect(), scale = wr.width / wrap.offsetWidth || 1;
  tip.innerHTML = `${esc(el.dataset.tip)}<small>${esc(el.dataset.sub || "")}</small>`;
  const x = (r.left + r.width/2 - wr.left) / scale, y = (r.top - wr.top) / scale;
  tip.style.left = Math.min(wrap.offsetWidth - 150, Math.max(150, x)) + "px"; tip.style.top = y + "px"; tip.hidden = false;
}
function hideTip(el){ const wrap = el && el.closest && el.closest(".weave-wrap"); const tip = wrap && wrap.querySelector(".wtip"); if(tip) tip.hidden = true; }
["mouseover","focusin"].forEach(ev => document.addEventListener(ev, e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el) showTip(el); }));
["mouseout","focusout"].forEach(ev => document.addEventListener(ev, e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el) hideTip(el); }));
function moveStitch(el, key){
  const svg = el.closest("svg"), all = [...svg.querySelectorAll(".st-g")];
  const lane = +el.dataset.lane, t = +el.dataset.t;
  let next = null;
  if(key === "ArrowLeft" || key === "ArrowRight"){
    const same = all.filter(x => +x.dataset.lane === lane).sort((a, b) => a.dataset.t - b.dataset.t);
    const i = same.indexOf(el); next = same[i + (key === "ArrowRight" ? 1 : -1)];
  } else {
    const lanes = [...new Set(all.map(x => +x.dataset.lane))].sort((a, b) => a - b);
    const li = lanes.indexOf(lane) + (key === "ArrowDown" ? 1 : -1);
    if(lanes[li] !== undefined) next = all.filter(x => +x.dataset.lane === lanes[li]).sort((a, b) => Math.abs(a.dataset.t - t) - Math.abs(b.dataset.t - t))[0];
  }
  if(next) next.focus();
}

  "toggle-attach"(){ S.conv.showAttach = !S.conv.showAttach; },
  unqueue(){ S.drafts.compose = S.conv.queued; S.conv.queued = null; },
  copy(id){
    const el = document.getElementById(id); if(!el) return;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl+C to copy."); };
    try { navigator.clipboard.writeText(el.textContent).then(() => toast("Copied"), fallback); } catch(e){ fallback(); }
    return "norender";
  },
  toast(m){ toast(m); return "norender"; },
  topen(id){ S.open[id] = !S.open[id]; },
  tsel(id){ S.target = id; S.form = null; S.tConfirm = null; },
  relay(arg){ const [id, v] = arg.split("|"); tgt(id).relay = v; },
  scan(id){
    S.scan[id] = {busy:true};
    setTimeout(() => { S.scan[id] = {exp:Date.now() + 598e3, sel:"ED25519", ok:false, keys:[
      {type:"ED25519", fp:"SHA256:7mWq3pX9Lr2cVd8Kz1TnYh4bGf6sJe0uQa5oRiN2xwE"},
      {type:"ECDSA", fp:"SHA256:Ub8Kd2Ls9Wq4Xn7Rc1Vm5Tg3Hy6Jp0Ze8Fa2Qo4Bk9"},
      {type:"RSA", fp:"SHA256:c4Nv7Rq1Wm8Kx2Ld5Ts9Hb3Yg6Jf0Pa4Ue7Zo1Qi8"}]}; render(); }, 1100);
  },
  "pick-key"(arg){ const [id, ty] = arg.split("|"); S.scan[id].sel = ty; },
  "key-ok"(id){ S.scan[id].ok = !S.scan[id].ok; },
  pin(id){ const sc = S.scan[id], k = sc.keys.find(x => x.type === sc.sel); tgt(id).pinned = k; delete S.scan[id]; toast(`Pinned the ${k.type} key for ${tgt(id).name}`); return "norender"; },
  unpin(id){ tgt(id).pinned = null; toast(`Unpinned ${tgt(id).name}'s host key`); return "norender"; },
  test(id){ S.test[id] = "busy"; setTimeout(() => { S.test[id] = "ok"; const t = tgt(id); if(t.health) t.health.at = "just now"; else t.health = {reachable:true, ms:41, tmux:"3.5a", disk:"n/a", at:"just now"}; render(); }, 1300); },
  ws(arg){
    const [id, op] = arg.split("|"), w = S.workspaces.find(x => x.id === id);
    if(op === "reopen"){ w.st = "idle"; delete w.reason; }
    if(op === "archive") w.st = "archived";
    if(op === "delete") S.wsConfirm = id;
    if(op === "keep") S.wsConfirm = null;
    if(op === "yes"){ S.workspaces = S.workspaces.filter(x => x.id !== id); S.wsConfirm = null; toast(`Deleted ${w.name}`); return "norender"; }
  },
  "edit-target"(id, dev){ const t = tgt(id); S.form = {mode:"edit", id, v:{name:t.name, kind:t.kind, host:t.host, user:t.user, port:String(t.port), root:t.root, perm:t.perm, purpose:t.purpose, agents:t.agents.join(", "), provision:t.provision, shell:t.shell, confirm:t.confirm}}; S.formErr = ""; if(dev === "p") S.ui.p.sheet = "form"; },
  register(a, dev){ S.form = {mode:"new", v:NEW_FORM()}; S.formErr = ""; if(dev === "p") S.ui.p.sheet = "form"; },
  "form-cancel"(){ S.form = null; S.ui.p.sheet = null; },
  "del-target"(id){ S.tConfirm = id; },
  "del-target-keep"(){ S.tConfirm = null; },
  "v-add"(){ S.vaultAdd = true; S.vaultErr = ""; },
  "v-cancel"(){ S.vaultAdd = false; S.vaultErr = ""; S.drafts.vName = ""; S.drafts.vAgent = ""; S.drafts.vWs = ""; },
  "v-replace"(id){ S.replacing = id; S.deleting = null; },
  "v-rcancel"(){ S.replacing = null; },
  "v-del"(id){ S.deleting = id; S.replacing = null; },
  "v-dcancel"(){ S.deleting = null; },
  "v-del-yes"(id){ const c = S.creds.find(x => x.id === id); S.creds = S.creds.filter(x => x.id !== id); S.deleting = null; toast(`Deleted ${c.name}`); return "norender"; },
  "dev-out"(id){ const d = S.devices.find(x => x.id === id); S.devices = S.devices.filter(x => x.id !== id); toast(`Logged out ${d.name}`); return "norender"; },
  logout(){ closeSheets(); S.screen = "login"; S.login = {err:"", busy:false, back:""}; },
};
const FORMS = {
  "i-reply"(){ const t = S.drafts.reply.trim(); if(!t) return; S.drafts.reply = ""; answerPrompt(`"${t}"`); return "norender"; },
  send(){
    const t = S.drafts.compose.trim(); if(!t) return;
    S.drafts.compose = "";
    if(S.convId === "new"){ toast("In the real client this starts the conversation and opens its turn."); return "norender"; }
    if(S.conv.turn){ S.conv.queued = S.conv.queued ? S.conv.queued + "\n" + t : t; return; }
    S.conv.extra.push({who:"me", t:nowM(), text:t}); startTurn(S.convId, "plain"); return "norender";
  },
  target(form, dev){
    const v = S.form.v; v.name = v.name.trim(); v.host = v.host.trim(); v.user = v.user.trim(); v.root = v.root.trim();
    const port = Number(v.port || 0);
    let err = "";
    if(!v.name) err = "Give the machine a name.";
    else if(v.kind === "remote" && (!v.host || !v.user)) err = "Host and user are required for a remote target.";
    else if(v.kind === "remote" && (!Number.isInteger(port) || port < 0 || port > 65535)) err = "The SSH port must be a number from 0 to 65535.";
    else if(v.root && (!v.root.startsWith("/") || v.root === "/")) err = "The workspace root must be an absolute path, and not /.";
    S.formErr = err; if(err) return;
    const fields = {name:v.name, kind:v.kind, host:v.kind==="remote"?v.host:"", user:v.kind==="remote"?v.user:"", port:v.kind==="remote"?port:0, root:v.root, perm:v.perm, purpose:v.purpose, agents:v.agents.split(",").map(s=>s.trim()).filter(Boolean), provision:v.provision, shell:v.shell, confirm:v.confirm};
    let id;
    if(S.form.mode === "new"){ id = "t" + Date.now(); S.targets.push({id, relay:"", pinned:null, health:null, ...fields}); }
    else { id = S.form.id; Object.assign(tgt(id), fields); }
    const was = S.form.mode; S.form = null; S.ui.p.sheet = null; S.target = id; S.open[id] = true;
    toast(was === "new" ? `Registered ${fields.name}` : `Saved ${fields.name}`); return "norender";
  },
  "v-add"(form){
    const name = S.drafts.vName.trim(), valEl = form.querySelector('input[type="password"]'), val = valEl.value;
    const agent = S.drafts.vAgent.trim(), ws = S.drafts.vWs;
    let err = "";
    if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) err = "The name becomes an environment variable: letters, digits and _, not starting with a digit.";
    else if(["PATH","HOME","SHELL","USER","TERM"].includes(name) || name.startsWith("LOOMUX_")) err = "That name is used by the shell or by Loomux itself. Pick another.";
    else if(S.creds.some(c => c.name === name && c.ws === ws && c.agent === agent)) err = "A credential with that name already exists for this scope. Replace its value instead.";
    else if(!val) err = "Enter a value.";
    S.vaultErr = err; if(err) return;
    valEl.value = "";
    S.creds.push({id:"c" + Date.now(), name, ws, agent, upd:"just now"});
    S.vaultAdd = false; S.drafts.vName = ""; S.drafts.vAgent = ""; S.drafts.vWs = "";
    toast(`Saved ${name}`); return "norender";
  },
  "v-replace"(form){
    const id = form.dataset.arg, el = form.querySelector("input"), c = S.creds.find(x => x.id === id);
    if(!el.value){ toast("Enter a new value first."); return "norender"; }
    el.value = ""; c.upd = "just now"; S.replacing = null; toast(`Replaced the value of ${c.name}`); return "norender";
  },
  login(form){
    const pw = form.querySelector('input[type="password"]').value;
    S.login.busy = true; S.login.err = ""; render();
    setTimeout(() => {
      S.login.busy = false;
      if(pw === "loom"){ const back = S.login.back; S.login.back = "Restart the staging ledger deploy"; if(back){ S.convId = "restart"; S.screen = "conversation"; } else S.screen = "inbox"; toast("Logged in"); syncTools(); }
      else { S.login.err = "That password didn't work (invalid password). Check it and try again."; render(); }
    }, 700);
    return "norender";
  },
};

document.addEventListener("click", e => {
  const tool = e.target.closest("[data-tool]");
  if(tool){
    const [k, v] = tool.dataset.tool.split(":");
    if(k === "screen"){ S.screen = v; closeSheets(); S.form = null; if(v === "conversation" && !CONVS[S.convId]) S.convId = "ratelimit"; render(); }
    if(k === "conv"){ S.convId = v; S.screen = "conversation"; closeSheets(); render(); }
    if(k === "frame"){ S.frame = v; store("frame", v); buildStage(); }
    if(k === "theme"){ S.theme = v; store("theme", v); applyTheme(); }
    store("screen", S.screen); syncTools(); return;
  }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(el.dataset.act === "sel" && e.target.closest("summary, input, textarea, select, label, form")) return;
  const root = el.closest("[data-dev]"); const dev = root ? root.dataset.dev : "d";
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault();
  e.stopPropagation();
  const r = fn(el.dataset.arg, dev);
  if(r !== "norender") render();
  syncTools();
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if(!f) return;
  e.preventDefault();
  const root = f.closest("[data-dev]"); const dev = root ? root.dataset.dev : "d";
  const r = FORMS[f.dataset.form](f, dev);
  if(r !== "norender") render();
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.model){
    S.drafts[t.dataset.model] = t.value;
    if(t.dataset.grow){ t.rows = Math.min(6, Math.max(1, t.value.split("\n").length)); const b = t.form && t.form.querySelector('button[type="submit"]'); if(b) b.disabled = !t.value.trim(); }
  }
  if(t.dataset.search !== undefined){ S.search = t.value; render(); }
  if(t.dataset.fmodel && S.form){ S.form.v[t.dataset.fmodel] = t.type === "checkbox" ? t.checked : t.value; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.fmodel && S.form){ S.form.v[t.dataset.fmodel] = t.type === "checkbox" ? t.checked : t.value; if(t.dataset.rerender) render(); }
  if(t.dataset.model && t.tagName === "SELECT") S.drafts[t.dataset.model] = t.value;
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if(t.dataset && t.dataset.model === "compose" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); t.form.requestSubmit(); return; }
  const g = t.closest && t.closest('[role="button"][data-act], [role="link"][data-act]');
  if(g && g.tagName !== "BUTTON"){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); g.dispatchEvent(new MouseEvent("click", {bubbles:true})); return; }
    if(g.classList.contains("st-g") && e.key.startsWith("Arrow")){ e.preventDefault(); moveStitch(g, e.key); }
  }
  if(e.key === "Escape" && S.jumpOpen){ S.jumpOpen = false; render(); }
});

// ---------- boot ----------
(function boot(){
  S.frame = load("frame") || (innerWidth < 900 ? "phone" : "both");
  S.theme = load("theme") || "system";
  const sc = load("screen"); if(sc && ["inbox","today","conversation","machines","vault","login"].includes(sc)) S.screen = sc;
  // Plain #anchors pick a state, e.g. #today, #today.dark.desktop, #conversation.restart
  for(const tok of location.hash.replace(/^#/, "").split(".").filter(Boolean)){
    if(["inbox","today","conversation","machines","vault","login"].includes(tok)) S.screen = tok;
    else if(["light","dark","system"].includes(tok)) S.theme = tok;
    else if(["phone","desktop","both"].includes(tok)) S.frame = tok;
    else if(CONVS[tok]) S.convId = tok;
    else if(tok === "yesterday") S.day = "yesterday";
  }
  S.pulse = true; setTimeout(() => { S.pulse = false; }, 3000);
  applyTheme(); buildStage(); syncTools();
  addEventListener("resize", fit);
  setInterval(tick, 1000);
})();
</script>

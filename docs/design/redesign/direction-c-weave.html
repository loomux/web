<title>Loomux Weave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype toolbar on top; a stage holding a phone canvas (390x844) and a scaled desktop canvas (1280x820).
   Inside the mock: the loom. Machines are the warp, conversations the weft, turns and offers the stitches. */
:root {
  --bg: #E3E8EF;          /* page ground behind the mock: cool undyed cotton */
  --cloth: #F4F6F9;       /* app surface */
  --cloth-2: #E8ECF2;     /* sunken surface, user messages, lane bands */
  --cloth-3: #DCE2EB;
  --ink: #161E45;         /* indigo-black text */
  --ink-2: #505A7E;       /* secondary text */
  --line: #C9D1DE;
  --indigo: #27378A;      /* primary action, the dye */
  --on-indigo: #FFFFFF;
  --woad: #4A79B2;        /* warp threads, links */
  --madder: #B0342B;      /* needs you: knots */
  --madder-soft: #F5DFDC;
  --weld: #A87C00;        /* offers, shuttle */
  --weld-soft: #F4EACB;
  --ok: #2D7A57;          /* done: weld over woad makes green */
  --ok-soft: #DCEEE4;
  --warp: #C2CDDF;
  --halo: #F4F6F9;
  --pane-bg: #121835;
  --pane-fg: #CAD2EE;
  --pane-dim: #7D88B3;
  --device: #1A2046;
  --chrome: #D3DAE5;
  --chrome-ink: #24305E;
  --focus: #3F74C8;
  --t1: #4A79B2; --t2: #27378A; --t3: #A87C00; --t4: #6F80A9; --t5: #8C4F7A;
  --ui: "Familjen Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --prose: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #090C22; --cloth: #12183A; --cloth-2: #1A2148; --cloth-3: #242C58; --ink: #E3E7F5; --ink-2: #9CA5C9; --line: #2D3663;
  --indigo: #94A5F2; --on-indigo: #0C1030; --woad: #7EA6DC; --madder: #EF6E61; --madder-soft: #3B1B2C; --weld: #E5BB43; --weld-soft: #362F18;
  --ok: #62C596; --ok-soft: #173329; --warp: #2B3462; --halo: #12183A; --pane-bg: #070A1C; --pane-fg: #C8D0EE; --pane-dim: #6A76A6;
  --device: #02040F; --chrome: #0F1433; --chrome-ink: #C9D1F0; --focus: #9DBDFF;
  --t1: #7EA6DC; --t2: #94A5F2; --t3: #E5BB43; --t4: #8D9BC6; --t5: #C98BB6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #090C22; --cloth: #12183A; --cloth-2: #1A2148; --cloth-3: #242C58; --ink: #E3E7F5; --ink-2: #9CA5C9; --line: #2D3663;
  --indigo: #94A5F2; --on-indigo: #0C1030; --woad: #7EA6DC; --madder: #EF6E61; --madder-soft: #3B1B2C; --weld: #E5BB43; --weld-soft: #362F18;
  --ok: #62C596; --ok-soft: #173329; --warp: #2B3462; --halo: #12183A; --pane-bg: #070A1C; --pane-fg: #C8D0EE; --pane-dim: #6A76A6;
  --device: #02040F; --chrome: #0F1433; --chrome-ink: #C9D1F0; --focus: #9DBDFF;
  --t1: #7EA6DC; --t2: #94A5F2; --t3: #E5BB43; --t4: #8D9BC6; --t5: #C98BB6; color-scheme: dark; }

html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--ui); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- prototype toolbar (not part of the design) ---------- */
.tb { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--chrome); color: var(--chrome-ink);
  border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 13px; }
.tb-title { font-weight: 600; margin-right: auto; display: flex; gap: 8px; align-items: center; }
.tb-title small { font-weight: 400; color: var(--ink-2); }
.tb-group { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.tb-group > span { color: var(--ink-2); margin-right: 6px; }
.tb-group button { border: 1px solid var(--line); background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; min-height: 30px; }
.tb-group button[aria-pressed="true"] { background: var(--chrome-ink); color: var(--chrome); border-color: var(--chrome-ink); }

.stage { padding: 20px 16px 40px; display: flex; gap: 24px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.phone-wrap, .desk-wrap { position: relative; flex: none; }
.frame-label { font-size: 12px; color: var(--ink-2); margin: 0 0 8px 4px; }
.phone { position: absolute; top: 0; left: 0; width: 414px; height: 868px; padding: 12px; border-radius: 54px; background: var(--device); transform-origin: top left; }
.phone-screen { position: relative; width: 390px; height: 844px; border-radius: 42px; overflow: hidden; background: var(--cloth); }
.desk { position: absolute; top: 0; left: 0; width: 1280px; height: 820px; transform-origin: top left; border-radius: 12px; overflow: hidden;
  background: var(--cloth); border: 1px solid var(--line); box-shadow: 0 18px 50px -24px rgba(10, 16, 50, .45); }

/* ---------- app base ---------- */
.app { font-family: var(--ui); color: var(--ink); background: var(--cloth); font-size: 14px; line-height: 1.45; position: absolute; inset: 0; }
.app h1, .app h2, .app h3 { margin: 0; text-wrap: balance; font-weight: 600; }
.app p { margin: 0; }
.app ul, .app ol { margin: 0; padding: 0; list-style: none; }
.mono { font-family: var(--mono); font-size: .86em; }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 8px;
  border: 1.5px solid transparent; background: transparent; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--indigo); color: var(--on-indigo); }
.btn-approve { background: var(--indigo); color: var(--on-indigo); }
.btn-deny { border-color: var(--ink-2); color: var(--ink); }
.btn-line { border-color: var(--line); color: var(--ink); background: var(--cloth); }
.btn-danger { background: var(--madder); color: var(--cloth); }
.btn-text { padding: 0 6px; min-height: 30px; color: var(--woad); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.ph .btn { min-height: 44px; }
.ph .btn-text { min-height: 44px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.pill.need { background: var(--madder-soft); color: var(--madder); }
.pill.work { background: var(--cloth-3); color: var(--ink); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.fail { background: var(--madder-soft); color: var(--madder); }
.pill.idle { background: var(--cloth-3); color: var(--ink-2); }

.field { display: grid; gap: 5px; }
.field label, .field .lbl { font-weight: 500; font-size: 13px; }
.field .help { font-size: 12.5px; color: var(--ink-2); }
.inp { width: 100%; min-height: 40px; padding: 8px 11px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--cloth); }
.ph .inp { min-height: 46px; font-size: 16px; }
.inp:focus-visible { outline-offset: 0; }
.err { color: var(--madder); font-size: 13px; font-weight: 500; }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 30; background: var(--ink); color: var(--cloth);
  padding: 10px 16px; border-radius: 10px; font-size: 13.5px; max-width: 90%; }
.ph .toast { bottom: 90px; }

/* ---------- desktop shell ---------- */
.d-chrome { height: 34px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--cloth-2); border-bottom: 1px solid var(--line); }
.d-dots { display: flex; gap: 6px; } .d-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
.d-url { font-size: 12px; color: var(--ink-2); background: var(--cloth); padding: 3px 12px; border-radius: 6px; min-width: 340px; }
.d-body { position: relative; display: grid; grid-template-columns: 208px 1fr; height: 786px; }
.d-side { border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--cloth); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 0 8px 18px; letter-spacing: .01em; }
.brand svg { width: 26px; height: 26px; border-radius: 5px; }
.navlink { display: flex; align-items: center; justify-content: space-between; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.navlink[aria-current="page"] { background: var(--cloth-2); color: var(--ink); }
.navlink:hover { color: var(--ink); }
.navcount { background: var(--madder); color: var(--cloth); border-radius: 999px; font-size: 12px; padding: 0 7px; min-width: 22px; text-align: center; font-weight: 600; }
.d-side-sep { height: 1px; background: var(--line); margin: 12px 8px; }
.logout { margin-top: auto; }
.d-main { overflow: auto; position: relative; }
.d-main.fixed { overflow: hidden; }
.d-pad { padding: 26px 28px 40px; }
.pg-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 20px; }
.pg-head h1 { font-size: 28px; letter-spacing: -.01em; }
.pg-head .sub { color: var(--ink-2); margin-top: 4px; }
.sec-h { font-size: 15px; display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.count { font-size: 12px; background: var(--madder); color: var(--cloth); border-radius: 999px; padding: 0 7px; font-weight: 600; }

/* ---------- phone shell ---------- */
.ph-app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--cloth); }
.ph-status { height: 34px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 6px 28px 0; font-size: 13px; font-weight: 600; }
.ph-sys { display: flex; gap: 5px; align-items: center; }
.ph-sys i { display: block; width: 16px; height: 9px; border: 1.5px solid var(--ink); border-radius: 3px; }
.ph-main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.ph-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px 10px; }
.ph-head h1 { font-size: 26px; letter-spacing: -.01em; }
.scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.ph-pad { padding: 4px 16px 28px; display: grid; gap: 22px; }
.ph-nav { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--cloth); padding: 4px 6px 18px; }
.ph-nav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; font-size: 12px; font-weight: 500; color: var(--ink-2); cursor: pointer; position: relative; border-radius: 10px; }
.ph-nav button[aria-current="page"] { color: var(--ink); }
.ph-nav button[aria-current="page"] svg { color: var(--indigo); }
.ph-nav svg { width: 22px; height: 22px; }
.ph-nav .navcount { position: absolute; top: 2px; left: 54%; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--cloth); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.scrim { position: absolute; inset: 0; background: rgba(8, 12, 40, .42); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--cloth); border-radius: 20px 20px 0 0; padding: 10px 16px 26px; display: grid; gap: 4px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.sheet button.sheet-row { min-height: 52px; text-align: left; border: 0; background: transparent; font-size: 16px; font-weight: 500; padding: 0 8px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.sheet .sheet-row small { color: var(--ink-2); font-weight: 400; font-size: 13px; }
</style>
<style>
/* ---------- weave diagram ---------- */
.weave-card { background: var(--cloth); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px; margin-bottom: 26px; }
.weave-card h2 { font-size: 15px; margin-bottom: 8px; }
.wv { display: block; overflow: visible; }
.wv text { font-family: var(--ui); }
.wv .wv-h { font-size: 11.5px; fill: var(--ink-2); }
.wv .wv-m { font-size: 13px; font-weight: 600; fill: var(--ink); }
.wv .wv-w { font-size: 12.5px; fill: var(--ink-2); }
.wv .wv-w.dim, .wv .band.dim { opacity: .55; }
.wv .band { fill: var(--cloth-2); }
.wv .warp { stroke: var(--warp); stroke-width: 1; }
.wv .warp.hr { stroke: var(--ink-2); stroke-opacity: .35; }
.wv .warp-halo { stroke: var(--halo); stroke-width: 4; }
.wv .weft { fill: none; stroke-width: 2.2; stroke-linecap: round; cursor: pointer; }
.wv .weft-active { stroke-width: 8; stroke-linecap: round; cursor: pointer; }
.wv .thread:hover .weft { stroke-width: 3.4; }
.wv .nowline { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 3 3; }
.wv .nowlbl { font-size: 11.5px; font-weight: 600; fill: var(--ink); }
.wv .kn { fill: var(--madder); }
.wv .kc { fill: var(--cloth); }
.wv .ring { fill: none; stroke: var(--madder); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: center; }
.wv .knot { cursor: pointer; }
.wv .knot:focus-visible { outline: none; }
.wv .knot:focus-visible .ring, .wv .knot:hover .ring { opacity: .9; }
.wv .knot.pulse .ring { animation: knotPulse 1.8s ease-out .5s 1 both; }
@keyframes knotPulse { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
.wv .mk-done { fill: var(--ok); }
.wv .mk-cmd { fill: var(--cloth); stroke: var(--ink-2); stroke-width: 1.5; }
.wv .mk-offer { fill: var(--weld); }
.wv .mk-x { stroke: var(--madder); stroke-width: 3; stroke-linecap: round; }
.wv .shuttle { fill: var(--weld); stroke: var(--ink); stroke-width: 1.2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; padding-left: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 22px; height: 14px; }
.today-cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.stack { display: grid; gap: 12px; }

/* ---------- decision card: one anatomy for offers, prompts, replies, failures ---------- */
.dc { border-radius: 14px; background: var(--cloth); border: 1.5px solid var(--line); padding: 14px 16px 16px; display: grid; gap: 10px; }
.dc.pending { border-color: color-mix(in srgb, var(--madder) 55%, var(--line)); }
.dc-who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.dc-who strong { color: var(--ink); font-weight: 600; }
.dc-who time { margin-left: auto; font-variant-numeric: tabular-nums; }
.dc h3 { font-size: 17px; line-height: 1.3; }
.dc .where { font-size: 13px; color: var(--ink-2); }
.dc .where b { color: var(--ink); font-weight: 500; }
.cmd { font-family: var(--mono); font-size: 13px; background: var(--pane-bg); color: var(--pane-fg); border-radius: 9px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; margin: 0; }
.dc-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ph .dc-acts .btn-approve, .ph .dc-acts .btn-deny { flex: 1; }
.expiry { font-size: 13px; color: var(--weld); font-weight: 500; font-variant-numeric: tabular-nums; }
.resolved { font-size: 14px; font-weight: 500; display: flex; gap: 8px; align-items: center; }
.resolved.ok { color: var(--ok); } .resolved.no { color: var(--ink-2); }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; justify-content: flex-start; white-space: normal; padding: 8px 12px; min-height: 40px; border: 1.5px solid var(--line); background: var(--cloth-2); border-radius: 9px; }
.opt b { font-variant-numeric: tabular-nums; margin-right: 6px; }
.reply-row { display: flex; gap: 8px; }
.reply-row .inp { flex: 1; min-width: 0; }
details.raw summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
details.raw pre { margin: 6px 0 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--ink-2); }
.older { border-top: 1px dashed var(--line); padding-top: 10px; }
.older > summary { cursor: pointer; font-weight: 500; padding: 6px 0; color: var(--ink-2); }
.older[open] > summary { margin-bottom: 8px; }

.mini-list { display: grid; gap: 4px; }
.mini { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: start; padding: 10px; border-radius: 10px; border: 0; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.mini:hover { background: var(--cloth-2); }
.mini .t { font-weight: 500; }
.mini .s { font-size: 13px; color: var(--ink-2); }
.mini .r { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ph .mini { min-height: 56px; }

/* phone vertical weave */
.vweave { position: relative; display: grid; gap: 0; }
.vrow { display: grid; grid-template-columns: 48px 26px 1fr; align-items: start; min-height: 54px; border: 0; background: transparent; text-align: left; padding: 0; cursor: pointer; width: 100%; }
.vrow time { font-size: 12.5px; color: var(--ink-2); padding-top: 3px; font-variant-numeric: tabular-nums; }
.vrow .vthread { position: relative; height: 100%; display: flex; justify-content: center; }
.vrow .vthread::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--warp); }
.vrow .vthread svg { position: relative; width: 16px; height: 16px; margin-top: 3px; background: var(--cloth); border-radius: 50%; }
.vrow .vtx { padding: 1px 0 12px 6px; }
.vrow .vtx b { font-weight: 500; display: block; }
.vrow .vtx span { font-size: 13px; color: var(--ink-2); }
.vnow { display: grid; grid-template-columns: 48px 1fr; align-items: center; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.vnow i { height: 0; border-top: 1.5px dashed var(--ink); display: block; }

/* ---------- conversation ---------- */
.conv-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100%; }
.conv-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.conv-head { padding: 18px 28px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.conv-head h1 { font-size: 21px; letter-spacing: -.005em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 500; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: block; }
.transcript { padding: 18px 28px 24px; display: grid; gap: 22px; }
.row { display: grid; grid-template-columns: 150px minmax(0, 620px); gap: 22px; }
.rail { display: grid; gap: 6px; align-content: start; padding-top: 2px; }
.stitch { display: grid; grid-template-columns: 38px 14px 1fr; gap: 6px; font-size: 12px; color: var(--ink-2); align-items: start; line-height: 1.35; }
.stitch time { font-variant-numeric: tabular-nums; }
.stitch.knot { color: var(--madder); font-weight: 500; }
.rail-inline { display: grid; gap: 4px; margin-top: 8px; padding-left: 2px; }
.rail-inline .stitch { grid-template-columns: 40px 14px 1fr; }
.who { font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; display: flex; gap: 8px; }
.who time { font-variant-numeric: tabular-nums; }
.msg-user { background: var(--cloth-2); border-radius: 12px; padding: 10px 14px 12px; }
.msg-user p { font-size: 15px; font-weight: 500; white-space: pre-wrap; }
.prose { font-family: var(--prose); font-size: 17.5px; line-height: 1.55; max-width: 62ch; }
.ph .prose { font-size: 17px; }
.prose p + p, .prose p + pre, .prose pre + p { margin-top: 10px; }
.prose code { font-family: var(--mono); font-size: .8em; background: var(--cloth-2); padding: 1px 5px; border-radius: 4px; }
.prose pre { font-family: var(--mono); font-size: 13px; line-height: 1.5; background: var(--pane-bg); color: var(--pane-fg); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 0; }

function needCard(n) {
  const cid = id("need-" + n.id);
  const where = `<p class="where">In <b>${esc(n.ws)}</b> on <b>${esc(n.target)}</b>, from “${esc(n.title)}”</p>`;
  if (n.kind === "offer") {
    const body = n.status === "pending"
      ? `<div class="dc-acts"><button class="btn btn-deny" data-act="deny" data-id="${n.id}">Deny</button><button class="btn btn-approve" data-act="approve" data-id="${n.id}">Approve</button>
         <span class="expiry">Expires in <span data-until="${n.expires}">${fmtCd(n.expires - Date.now())}</span></span></div>`
      : n.status === "approved" ? `<p class="resolved ok">${icons.ok}Approved. Running it now.</p>`
      : n.status === "denied" ? `<p class="resolved no">${icons.no}Denied: nothing was run.</p>`
      : `<p class="resolved no">${icons.no}Expired: nothing was run. Send the request again if you still want it.</p>`;
    return `<section class="dc ${n.status === "pending" ? "pending" : ""}" id="${cid}" tabindex="-1" aria-label="Confirmation">
      <div class="dc-who">${icons.offer}<strong>Loomux wants approval</strong><time>${n.at}</time></div>
      <h3>Run this command on ${esc(n.target)}?</h3>${where}
      <pre class="cmd">${esc(n.command)}</pre>${body}</section>`;
  }
  if (n.kind === "prompt") {
    const body = n.status === "pending"
      ? `<div class="opts">${n.options.map((o, i) => `<button class="btn opt" data-act="answer" data-id="${n.id}" data-opt="${i + 1}"><b>${i + 1}.</b>${esc(o)}</button>`).join("")}</div>
         <form class="reply-row" data-form="reply" data-id="${n.id}"><label class="sr-only" for="${id("rep-" + n.id)}">Reply to the agent</label>
         <input class="inp" id="${id("rep-" + n.id)}" data-bind="needs.${n.id}.reply" placeholder="Or tell it what to do instead…" value="${esc(n.reply)}">
         <button class="btn btn-line" type="submit">Reply</button></form>`
      : `<p class="resolved ok">${icons.ok}You answered: ${esc(n.answer)}. claude-code is working again.</p>`;
    return `<section class="dc ${n.status === "pending" ? "pending" : ""}" id="${cid}" tabindex="-1" aria-label="Agent needs attention">
      <div class="dc-who">${icons.knot}<strong>${esc(n.agent)} is asking you</strong><time>${n.at}</time></div>
      <h3>${esc(n.ptitle)}</h3>${where}<pre class="cmd">${esc(n.detail)}</pre><p>${esc(n.question)}</p>${body}</section>`;
  }
  if (n.kind === "failed") {
    const body = n.status === "pending"
      ? `<details class="raw"><summary>Details</summary><pre>${esc(n.raw)}</pre></details>
         <div class="dc-acts"><button class="btn btn-line" data-act="openConv" data-c="${n.conv}">Open conversation</button><button class="btn btn-primary" data-act="retry" data-id="${n.id}">Retry</button></div>`
      : `<p class="resolved ok">${icons.ok}Retrying. It's in Working below.</p>`;
    return `<section class="dc ${n.status === "pending" ? "pending" : ""}" id="${cid}" tabindex="-1" aria-label="Failed turn">
      <div class="dc-who">${icons.fail}<strong>Turn failed</strong><time>${n.at}</time></div>
      <h3>${esc(n.message)}</h3>${where}<p class="muted">${esc(n.hint)}</p>${body}</section>`;
  }
  // awaiting reply (older)
  const body = n.snoozed
    ? `<p class="resolved no">${icons.no}Snoozed until tomorrow at 09:00. <button class="btn btn-text" data-act="unsnooze" data-id="${n.id}">Undo</button></p>`
    : `<div class="dc-acts"><button class="btn btn-line" data-act="snooze" data-id="${n.id}">Snooze until tomorrow</button><button class="btn btn-primary" data-act="openConv" data-c="${n.conv}">Reply in conversation</button></div>`;
  return `<section class="dc" id="${cid}" tabindex="-1" aria-label="Waiting for your reply">
    <div class="dc-who">${icons.knot}<strong>${esc(n.agent)} is waiting for your reply</strong><time>${n.at}</time></div>
    <h3>${esc(n.question)}</h3>${where}${body}</section>`;
}

  { id: "c1", title: "Add rate limiting to the ledger-api /transfers endpoint", color: "var(--t1)", lane: "ledger-api", from: 545, last: 852,

function weaveSVG(W) {
  const labelW = 200, top = 46, laneH = 34, gap = 14, right = 30, start = 480;
  const now = nowMin();
  const end = Math.max(870, Math.ceil(now / 10) * 10 + 10);
  const X = t => labelW + (t - start) / (end - start) * (W - labelW - right);
  let y = top, prev = null; const L = {};
  LANES.forEach((l, i) => {
    if (i > 0 && l.machine !== prev) y += gap;
    prev = l.machine;
    L[l.id] = { ...l, top: y, y: y + laneH / 2, first: i === 0 || LANES[i - 1].machine !== l.machine };
    y += laneH;
  });
  const H = y + 6;
  const t = `${id("wvt")}`;
  let s = `<svg class="wv" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-labelledby="${t}"><title id="${t}">Today's work from 08:00 to now, one lane per workspace, grouped by machine. Red knots are waiting on you.</title>`;
  Object.values(L).forEach(l => {
    s += `<rect class="band${l.dim ? " dim" : ""}" x="${labelW - 10}" y="${l.top + 3}" width="${W - labelW + 10 - right + 14}" height="${laneH - 6}" rx="5"/>`;
    if (l.first && l.machine) s += `<text class="wv-m" x="0" y="${l.y + 4}">${esc(l.machine)}</text>`;
    s += `<text class="wv-w${l.dim ? " dim" : ""}" x="${l.id === "router" ? 0 : 82}" y="${l.y + 4}">${esc(l.name || l.id)}</text>`;
  });
  for (let m = start; m <= end; m += 60) s += `<text class="wv-h" x="${X(m).toFixed(1)}" y="14" text-anchor="middle">${hhmm(m)}</text>`;
  let under = "", over = "", k = 0;
  for (let m = start; m <= end; m += 10, k++) {
    const x = X(m).toFixed(1);
    const line = `<line class="warp${m % 60 === 0 ? " hr" : ""}" x1="${x}" x2="${x}" y1="${top - 4}" y2="${H - 4}"/>`;
    if (k % 2) over += `<line class="warp-halo" x1="${x}" x2="${x}" y1="${top}" y2="${H - 8}"/>` + line; else under += line;
  }
  s += under;
  WEFT.forEach(w => {
    const ly = L[w.lane].y + (w.dy || 0), ry = L.router.y + (w.ry || 0);
    const last = w.running ? now : w.last;
    let d;
    if (w.lane === "router") d = `M${X(w.from)} ${ly} H${X(last)}`;
    else { const x0 = X(w.from), x1 = X(w.from + 3), xm = (x0 + x1) / 2; d = `M${x0.toFixed(1)} ${ry} C${xm.toFixed(1)} ${ry} ${xm.toFixed(1)} ${ly} ${x1.toFixed(1)} ${ly} H${X(last).toFixed(1)}`; }
    s += `<g class="thread" data-act="openConv" data-c="${w.id}"><title>${esc(w.title)}</title><path class="weft" style="stroke:${w.color}" d="${d}"/>`;
    w.spans.forEach(([a, b]) => { const bb = b === "now" ? now : b; s += `<line class="weft-active" style="stroke:${w.color}" x1="${X(a).toFixed(1)}" x2="${Math.max(X(a) + .5, X(bb)).toFixed(1)}" y1="${ly}" y2="${ly}"/>`; });
    s += `</g>`;
  });
  s += over;
  WEFT.forEach(w => {
    const ly = L[w.lane].y + (w.dy || 0);
    (w.marks || []).forEach(m => { const x = X(m.t); s += `<rect class="mk-cmd" x="${x - 4.5}" y="${ly - 4.5}" width="9" height="9" rx="1"><title>Command, exit 0</title></rect>`; });
    if (w.end) { const x = X(w.last); s += `<rect class="mk-done" x="${x - 4.5}" y="${ly - 4.5}" width="9" height="9" rx="1"><title>Finished</title></rect>`; }
    if (w.running) { const x = X(now); s += `<path class="shuttle" d="M${x - 12} ${ly}l5-5h12l5 5-5 5h-12z"><title>${esc(w.title)}: working</title></path>`; }
    if (w.knot) {
      const n = S.needs.find(q => q.id === w.knot.need); const x = X(w.knot.t);
      if (n && n.status === "pending") {
        const lbl = `${n.title}: ${w.knot.fail ? "turn failed" : n.kind === "offer" ? "wants approval" : "asking you"}. Jump to it.`;
        s += `<g class="knot${S.pulse ? " pulse" : ""}" role="button" tabindex="0" data-act="jump" data-id="${n.id}" aria-label="${esc(lbl)}"><title>${esc(lbl)}</title>
          <circle class="ring" cx="${x}" cy="${ly}" r="11"/>`;
        s += w.knot.fail ? `<circle class="kc" cx="${x}" cy="${ly}" r="8"/><path class="mk-x" d="M${x - 4.5} ${ly - 4.5}l9 9M${x + 4.5} ${ly - 4.5}l-9 9"/>`
          : `<circle class="kn" cx="${x}" cy="${ly}" r="7.5"/><circle class="kc" cx="${x}" cy="${ly}" r="2.6"/>`;
        s += `</g>`;
      } else s += `<path class="mk-offer" d="M${x} ${ly - 6}l6 6-6 6-6-6z"><title>Answered</title></path>`;
    }
  });
  const xn = X(now).toFixed(1);
  s += `<line class="nowline" x1="${xn}" x2="${xn}" y1="${top - 14}" y2="${H - 2}"/><text class="nowlbl" x="${xn}" y="30" text-anchor="middle">now ${clock()}</text>`;
  return s + `</svg>`;
}

let turnTimers = [];
function startTurn(kind, pre) {

  const start = pre ? pre.start : Date.now();
  const tstr = ms => { const d = new Date(ms); return hhmm(Math.floor(NOW0 + (ms - T0) / 60000)); };
  S.turn = { kind, start, stage: pre ? pre.stage : 0, lines: pre ? pre.lines.slice() : [], times: [tstr(start), tstr(start + 1200), tstr(start + 3200)], cancelling: false };
  const tu = S.turn;
  if (!pre) {
    turnTimers.push(setTimeout(() => { if (S.turn === tu) { tu.stage = 1; render(); } }, 1200));
    turnTimers.push(setTimeout(() => { if (S.turn === tu) { tu.stage = 2; render(); } }, 3200));
  }
  let i = tu.lines.length;
  const feed = setInterval(() => {
    if (S.turn !== tu) return clearInterval(feed);
    if (tu.stage < 2 || i >= lines.length) return;
    tu.lines.push(lines[i++]); appendPane(lines[i - 1]);

function loomArt(w, h, cell) {
  const cols = Math.ceil(w / cell), rows = Math.ceil(h / cell);
  const warpC = ["var(--indigo)", "var(--indigo)", "var(--woad)", "var(--indigo)"];
  const weftC = ["var(--weld)", "var(--weld)", "var(--cloth)", "var(--madder)", "var(--cloth)", "var(--weld)", "var(--woad)", "var(--cloth)"];
  let s = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${w}" height="${h}" fill="var(--cloth-2)"/>`;
  for (let r = 0; r < rows; r++) s += `<rect x="0" y="${r * cell + 1}" width="${w}" height="${cell - 2}" fill="${weftC[Math.floor(r / 3) % weftC.length]}"/>`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    if ((r + c) % 4 < 2) s += `<rect x="${c * cell + 1}" y="${r * cell}" width="${cell - 2}" height="${cell}" fill="${warpC[c % 4]}"/>`;
  return s + `</svg>`;
}

    case "logout": S.sheet = false; S.login = { pw: "", err: "", busy: false }; return go("login");
    case "newConv": S.convNew = true; if (!S.conv) resetConv(); S.conv.entries = []; S.turn = null; S.draft = ""; return go("conv");
    case "openConv": S.convNew = false; if (!S.conv) resetConv(); if (S.conv.entries.length === 0) resetConv(); return go("conv");
    case "approve": { const n = need(d.id); n.status = "approved"; S.working.unshift({ id: n.conv, title: n.title, agent: "command", ws: n.ws, target: n.target, since: Date.now() });
      setTimeout(() => { S.working = S.working.filter(w => w.id !== n.conv); S.done.unshift({ id: n.conv, title: n.title, where: "Command in " + n.ws + ", exit 0", at: clock() }); render(); }, 9000);
      return toast("Approved. Running it on " + n.target + "."); }
    case "deny": need(d.id).status = "denied"; return toast("Denied. Nothing was run.");
    case "answer": { const n = need(d.id); n.status = "answered"; n.answer = d.opt + ". " + n.options[d.opt - 1];
      S.working.unshift({ id: n.conv, title: n.title, agent: n.agent, ws: n.ws, target: n.target, since: Date.now() }); return toast("Sent your answer to " + n.agent + "."); }
    case "retry": { const n = need(d.id); n.status = "retried"; S.working.unshift({ id: n.conv, title: n.title, agent: n.agent, ws: n.ws, target: n.target, since: Date.now() }); return toast("Retrying “" + n.title + "”."); }
    case "snooze": need(d.id).snoozed = true; return render();
    case "unsnooze": need(d.id).snoozed = false; return render();
    case "jump": { const fr = el.closest("[data-frame]"); const card = fr && fr.querySelector("#" + (fr.dataset.frame === "phone" ? "p-" : "d-") + "need-" + d.id);
      if (card) { card.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" }); card.focus({ preventScroll: true }); } return; }
    case "convApprove": S.conv.offer.status = "approved"; S.conv.offer.at = clock();
      S.conv.entries.push({ t: "user", at: clock(), text: "yes", answering: true, rail: [{ at: clock(), k: "cmd", text: "Command in ledger-api" }] });
      startTurn("cmd"); S.toBottom = true; return render();
    case "convDeny": S.conv.offer.status = "denied";
      S.conv.entries.push({ t: "user", at: clock(), text: "no", answering: true }); S.toBottom = true; return render();
    case "cancelTurn": S.turn.cancelling = true; render();
      setTimeout(() => { const tu = S.turn; if (!tu) return; turnTimers.forEach(clearTimeout); S.turn = null;
        const lastUser = [...S.conv.entries].reverse().find(e => e.t === "user");
        S.conv.entries.push({ t: "error", msg: "You cancelled this turn.", hint: "The agent's session is kept. Attach to see where it stopped, or retry.", raw: "dispatch d-41c2a7 failed (cancelled): cancelled by user", retry: lastUser ? lastUser.text : "" });
        S.toBottom = true; if (S.held) { const m = S.held; S.held = ""; S.draft = m; } render(); }, 1200);
      return;
    case "convRetry": return sendMessage(d.text);
    case "unhold": S.draft = S.held; S.held = ""; return render();
    case "copy": {
      const fr = el.closest("[data-frame]"); const code = fr.querySelector("#" + (fr.dataset.frame === "phone" ? "p-" : "d-") + d.target);
      const done = msg => { el.textContent = msg; setTimeout(() => { el.textContent = "Copy"; }, 2000); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected: press Ctrl+C"); };
      try { navigator.clipboard.writeText(code.textContent).then(() => done("Copied"), fallback); } catch (e) { fallback(); }
      return; }
    case "toggleTask": S.showTask[d.k] = !S.showTask[d.k]; return render();
    case "test": { const t = targ(d.t); t.test = "busy"; render(); setTimeout(() => { t.test = `Reachable, tmux ${t.health.tmux}, ${t.id === "t2" ? 41 : t.health.ms} ms`; render(); }, 900); return; }
    case "scan": { const t = targ(d.t); t.scan = { state: "scanning" }; render();
      setTimeout(() => { t.scan = { state: "scanned", until: Date.now() + 598000, keys: ["ED25519", "ECDSA", "RSA"].map(k => ({ type: k, fp: FPS[k] })) }; render(); }, 1100); return; }
    case "unscan": targ(d.t).scan = null; return render();
    case "pin": { const t = targ(d.t); const k = t.scan.keys.find(x => x.type === d.type); t.pinned = { type: k.type, fp: k.fp }; t.scan = null; return toast("Pinned " + k.type + " key for " + t.name + "."); }
    case "unpin": { const t = targ(d.t); t.pinned = null; return toast("Unpinned. " + t.name + " falls back to your SSH known_hosts."); }
    case "editT": { const t = targ(d.t); S.tform = { editing: t.id, name: t.name, kind: t.kind, host: t.host, user: t.user, port: t.port ? String(t.port) : "", root: t.root, perm: t.perm, purpose: t.purpose, relay: t.relay, agents: t.agents.join(", "), prov: t.prov, shell: t.shell, ask: t.ask, err: "" }; return render(); }
    case "newT": S.tform = { editing: null, name: "", kind: "remote", host: "", user: "", port: "", root: "", perm: "", purpose: "personal", relay: "", agents: "", prov: true, shell: true, ask: false, err: "" }; return render();
    case "closeT": S.tform = null; return render();
    case "wsSet": { const w = S.ws.find(x => x.id === d.w); w.status = d.v; if (d.v === "idle") delete w.reason; return toast((d.v === "archived" ? "Archived " : "Reopened ") + w.name + "."); }
    case "wsDel": S.wsConfirm = d.w; return render();
    case "wsDelNo": S.wsConfirm = null; return render();
    case "wsDelYes": { const w = S.ws.find(x => x.id === d.w); S.ws = S.ws.filter(x => x.id !== d.w); S.wsConfirm = null; return toast("Deleted " + w.name + ". Its files on the machine are kept."); }
    case "vAdd": S.vform = { name: "", value: "", ws: "", agent: "", err: "" }; return render();
    case "vCancel": S.vform = null; return render();
    case "vRep": S.vreplace = { id: d.k, value: "", err: "" }; return render();
    case "vRepCancel": S.vreplace = null; return render();
    case "vDel": S.vdel = d.k; return render();
    case "vDelNo": S.vdel = null; return render();
    case "vDelYes": { const c = S.creds.find(x => x.id === d.k); S.creds = S.creds.filter(x => x.id !== d.k); S.vdel = null; return toast("Deleted " + c.name + "."); }
    case "revoke": { const dv = S.devices.find(x => x.id === d.s); S.devices = S.devices.filter(x => x.id !== d.s); return toast("Signed out " + dv.name + "."); }
    case "cfilter": S.convFilter = d.v; return render();
  }
}
function submit(form, d) {
  if (form === "send") {
    const text = S.draft.trim(); if (!text) return;
    S.draft = "";
    if (S.turn) { S.held = text; return render(); }
    return sendMessage(text);
  }
  if (form === "reply") { const n = need(d.id); if (!n.reply.trim()) return; n.status = "answered"; n.answer = "“" + n.reply.trim() + "”";
    S.working.unshift({ id: n.conv, title: n.title, agent: n.agent, ws: n.ws, target: n.target, since: Date.now() }); return toast("Sent your reply to " + n.agent + "."); }
  if (form === "tform") {
    const f = S.tform;
    if (!f.name.trim()) { f.err = "Give the machine a name."; return render(); }
    if (f.kind === "remote" && (!f.host.trim() || !f.user.trim())) { f.err = "Host and user are required for a machine reached over SSH."; return render(); }
    if (f.root && (!f.root.startsWith("/") || f.root === "/")) { f.err = "The workspace folder must be an absolute path other than /."; return render(); }
    if (f.port && !/^\d+$/.test(f.port)) { f.err = "The SSH port is a number, like 22."; return render(); }
    const rec = { name: f.name.trim(), kind: f.kind, host: f.kind === "remote" ? f.host.trim() : "", user: f.kind === "remote" ? f.user.trim() : "", port: f.port ? +f.port : 0,
      root: f.root, perm: f.perm, purpose: f.purpose, relay: f.relay, agents: f.agents.split(",").map(s => s.trim()).filter(Boolean), prov: f.prov, shell: f.shell, ask: f.ask };
    if (f.editing) Object.assign(targ(f.editing), rec);
    else S.targets.push({ id: "t" + Date.now(), ...rec, pinned: null, scan: null, test: null, health: { ok: true, ms: 0, tmux: "unknown", disk: "unknown", probed: "not yet" } });
    S.tform = null; return toast(f.editing ? "Saved changes to " + rec.name + "." : "Registered " + rec.name + ". Scan and pin its host key next.");
  }
  if (form === "vform") {
    const f = S.vform; const name = f.name.trim();
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) { f.err = "The name becomes an environment variable: use letters, digits and underscores, not starting with a digit."; return render(); }
    if (["PATH", "HOME", "SHELL", "LOOMUX_TOKEN"].includes(name)) { f.err = "That name is used by the shell or by Loomux itself. Pick another."; return render(); }
    if (S.creds.some(c => c.name === name && c.ws === f.ws && c.agent === f.agent)) { f.err = "A credential with that name already exists for this scope. Replace its value instead."; return render(); }
    if (!f.value) { f.err = "Enter a value."; return render(); }
    S.creds.unshift({ id: "k" + Date.now(), name, ws: f.ws, agent: f.agent, upd: "Updated just now" });
    S.vform = null; // the value leaves the page here
    return toast("Saved " + name + ". Its value won't be shown again.");
  }
  if (form === "vreplace") {
    const r = S.vreplace; if (!r.value) { r.err = "Enter the new value."; return render(); }
    const c = S.creds.find(x => x.id === r.id); c.upd = "Updated just now"; S.vreplace = null;
    return toast("Replaced the value of " + c.name + ".");
  }
  if (form === "login") {
    const L = S.login; if (!L.pw) return;
    L.busy = true; L.err = ""; render();
    setTimeout(() => {
      L.busy = false;
      if (L.pw === "loom") { S.login = { pw: "", err: "", busy: false }; if (!S.conv) resetConv(); S.convNew = false; go("conv"); }
      else { L.err = "Invalid password. Check it and try again."; L.pw = ""; render(); const el = document.getElementById(P + "pw"); if (el) el.focus(); }
    }, 650);
  }
}

/* ================= events ================= */
function framePrefix(el) { const f = el.closest("[data-frame]"); P = f && f.dataset.frame === "phone" ? "p-" : "d-"; DEV = P === "p-" ? "phone" : "desk"; }
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tb]");
  if (tb) {
    const k = tb.dataset.tb, v = tb.dataset.v; S[k] = v; store.set(k, v);
    if (k === "scenario") { resetConv(); S.convNew = false; }
    if (k === "screen" && v === "conv") { S.convNew = false; if (!S.conv) resetConv(); }
    S.sheet = false; return render();
  }
  const a = e.target.closest("[data-act]");
  if (!a || a.matches("input, select, details")) return;
  framePrefix(a); act(a.dataset.act, a.dataset, a);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault(); framePrefix(f); submit(f.dataset.form, f.dataset);
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  setPath(el.dataset.bind, v);
  document.querySelectorAll(`[data-bind="${el.dataset.bind}"]`).forEach(o => { if (o !== el) { if (o.type === "checkbox") o.checked = v; else o.value = v; } });
  if (el.hasAttribute("data-grow")) grow(el);
  if (el.hasAttribute("data-rerender-btn")) document.querySelectorAll("[data-loginbtn]").forEach(b => { b.disabled = !S.login.pw || S.login.busy; });
  if (el.hasAttribute("data-rerender")) render();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind && (el.type === "checkbox" || el.tagName === "SELECT")) {
    setPath(el.dataset.bind, el.type === "checkbox" ? el.checked : el.value);
    if (el.hasAttribute("data-rerender")) render();
    return;
  }
  const ac = el.dataset && el.dataset.actChange; if (!ac) return;
  if (ac === "relay") { const t = targ(el.dataset.t); t.relay = el.value; toast("Saved. " + t.name + ": the router models now see " + ({ full: "everything", last_message: "the final answer only", none: "nothing" })[effRelay(t)] + "."); }
  if (ac === "tkind") { S.tform.kind = el.value; render(); }
  if (ac === "tpurpose") { S.tform.purpose = el.value; render(); }
});
document.addEventListener("toggle", e => { const el = e.target; if (el.dataset && el.dataset.actToggle) S[el.dataset.actToggle] = el.open; }, true);
document.addEventListener("keydown", e => {
  const el = e.target;
  if (el.matches && el.matches("textarea[data-bind=draft]") && e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); framePrefix(el); submit("send", {}); return;
  }
  if ((e.key === "Enter" || e.key === " ") && el.getAttribute && el.getAttribute("role") === "button" && el.dataset.act) { e.preventDefault(); framePrefix(el); act(el.dataset.act, el.dataset, el); }
});
window.addEventListener("resize", layout);

/* ================= clock ================= */
setInterval(() => {
  const now = Date.now(); let dirty = false;
  document.querySelectorAll("[data-since]").forEach(el => { el.textContent = fmtEl(now - +el.dataset.since); });
  document.querySelectorAll("[data-until]").forEach(el => { el.textContent = fmtCd(+el.dataset.until - now); });
  S.needs.forEach(n => { if (n.kind === "offer" && n.status === "pending" && now >= n.expires) { n.status = "expired"; dirty = true; } });
  if (S.conv && S.conv.offer.status === "pending" && now >= S.conv.offer.expires) { S.conv.offer.status = "expired"; dirty = true; }
  S.targets.forEach(t => { if (t.scan && t.scan.state === "scanned" && now >= t.scan.until) { t.scan.state = "expired"; dirty = true; } });
  if (dirty) render();
}, 1000);
setInterval(() => { const ae = document.activeElement; if (S.screen === "today" && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); }, 60000);

/* ================= boot ================= */
resetConv();
if (S.screen === "conv" && S.scenario !== "running") S.convNew = false;
render();
setTimeout(() => { S.pulse = false; }, 2600);
</script>

<title>Loomux Patchbay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Patchbay: a console for the tmux it drives. Pane glass is the hero; lamps carry state (shape + colour); everything else is brushed metal and quiet. */
:root {
  --stage: #b9bfc5;          /* prototype backdrop */
  --bar: #2a3137;            /* prototype toolbar */
  --bar-ink: #e6eaed;
  --metal: #d5d9dd;          /* aluminium panel */
  --metal-2: #c7ccd1;        /* recessed panel */
  --metal-hi: #e6e9ec;       /* raised face */
  --edge: #a9b0b7;
  --edge-soft: #bfc5cb;
  --ink: #1d2328;
  --ink-2: #4b545d;
  --ink-3: #6b747c;
  --glass: #182025;          /* pane glass, dark in both themes */
  --glass-2: #1f292f;
  --glass-ink: #c9d5d1;
  --glass-dim: #7f8d8b;
  --glass-edge: #0e1418;
  --amber: #e89b00;          /* needs you */
  --amber-ink: #6b4500;
  --teal: #12a3b4;           /* working */
  --red: #d2463a;            /* failed / broken */
  --unlit: #8b949b;          /* done / idle */
  --go: #1d2328;             /* approve button fill */
  --go-ink: #f2f4f6;
  --focus: #1f6fd1;
  --brush: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 1px, rgba(0,0,0,.025) 1px 3px);
  --sans: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #12171b; --bar: #0d1114; --bar-ink: #d4dade;
    --metal: #262d33; --metal-2: #1e2429; --metal-hi: #2e363d; --edge: #3b454d; --edge-soft: #323b42;
    --ink: #e2e7eb; --ink-2: #a3aeb7; --ink-3: #7d8891;
    --glass: #0f1417; --glass-2: #161d21; --glass-ink: #c6d2ce; --glass-dim: #6f7d7b; --glass-edge: #080b0d;
    --amber: #f2a91a; --amber-ink: #f6c45c; --teal: #22b8c9; --red: #e35a4d; --unlit: #6a747c;
    --go: #e2e7eb; --go-ink: #161b1f; --focus: #5aa2ff;
    --brush: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,.05) 1px 3px);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #12171b; --bar: #0d1114; --bar-ink: #d4dade;
  --metal: #262d33; --metal-2: #1e2429; --metal-hi: #2e363d; --edge: #3b454d; --edge-soft: #323b42;
  --ink: #e2e7eb; --ink-2: #a3aeb7; --ink-3: #7d8891;
  --glass: #0f1417; --glass-2: #161d21; --glass-ink: #c6d2ce; --glass-dim: #6f7d7b; --glass-edge: #080b0d;
  --amber: #f2a91a; --amber-ink: #f6c45c; --teal: #22b8c9; --red: #e35a4d; --unlit: #6a747c;
  --go: #e2e7eb; --go-ink: #161b1f; --focus: #5aa2ff;
  --brush: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,.05) 1px 3px);
  color-scheme: dark;
}

html, body { min-height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--sans); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- prototype toolbar (not part of the design) ---------- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bar); color: var(--bar-ink);
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 8px 16px; font-size: 13px; }
.proto b { font-weight: 600; letter-spacing: .01em; }
.proto .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.proto .grp > span { opacity: .7; }
.proto button { background: transparent; border: 1px solid rgba(255,255,255,.22); color: var(--bar-ink); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
.proto button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); border-color: var(--bar-ink); }
.proto .note { opacity: .7; font-size: 12px; flex-basis: 100%; }

.stage { padding: 20px 16px 40px; display: flex; gap: 24px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.frame-label { font-size: 12px; color: var(--ink-2); margin: 0 0 6px 4px; }
.phone-shell { width: 414px; max-width: 100%; }
.phone-scaler { transform-origin: top left; }
.phone { width: 390px; height: 844px; border-radius: 44px; padding: 12px; background: #111518; box-shadow: 0 0 0 1px #000, 0 18px 40px rgba(0,0,0,.25); position: relative; }
.phone .screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; position: relative; background: var(--metal); }
.desk-shell { min-width: 0; flex: 1 1 640px; max-width: 1280px; }
.desk-scaler { transform-origin: top left; }
.desk { width: 1280px; height: 820px; border-radius: 10px; overflow: hidden; background: var(--metal); box-shadow: 0 0 0 1px var(--edge), 0 18px 40px rgba(0,0,0,.18); position: relative; }

/* ---------- app shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; background: var(--metal); background-image: var(--brush); color: var(--ink); }
.app.phone-app { font-size: 15px; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 14px; height: 52px; background: var(--metal-hi); border-bottom: 1px solid var(--edge); flex: none; }
.phone-app .topbar { padding-top: 22px; height: 82px; }
.mark { font-weight: 700; font-size: 18px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.mark .rivets { display: inline-grid; grid-template-columns: repeat(3, 5px); gap: 2px; }
.mark .rivets i { width: 5px; height: 5px; border-radius: 50%; background: var(--edge); }
.mark .rivets i.on { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.mark .rivets i.wk { background: var(--teal); }
.nav { display: flex; gap: 4px; margin-left: 10px; }
.nav button { border: 1px solid transparent; background: transparent; padding: 7px 12px; border-radius: 5px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.nav button[aria-current="page"] { background: var(--metal-2); border-color: var(--edge); color: var(--ink); box-shadow: inset 0 1px 2px rgba(0,0,0,.12); }
.spacer { flex: 1; }
.needs-count { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--edge); background: var(--metal-2); font-weight: 600; cursor: pointer; }
.needs-count.zero { font-weight: 400; color: var(--ink-2); }
.linkbtn { background: none; border: none; padding: 6px 8px; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.main { flex: 1; min-height: 0; overflow: auto; }
.statusline { flex: none; height: 26px; background: var(--glass); color: var(--glass-ink); font-family: var(--mono); font-size: 12px; display: flex; align-items: center; gap: 0; border-top: 1px solid var(--glass-edge); }
.statusline .sess { background: var(--teal); color: var(--glass); padding: 0 10px; height: 100%; display: flex; align-items: center; font-weight: 600; }
.statusline .win { padding: 0 10px; height: 100%; display: flex; align-items: center; gap: 6px; border: none; background: none; color: inherit; cursor: pointer; font: inherit; }
.statusline .win.cur { color: #fff; background: var(--glass-2); }
.statusline .right { margin-left: auto; display: flex; gap: 16px; padding-right: 12px; align-items: center; }
.statusline .hot { color: var(--amber); }

.bottomnav { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--metal-hi); border-top: 1px solid var(--edge); padding-bottom: 14px; }
.bottomnav button { border: none; background: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--ink-2); cursor: pointer; position: relative; }
.bottomnav button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.bottomnav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; background: var(--ink); border-radius: 0 0 3px 3px; }
.bottomnav .ico { width: 22px; height: 16px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
.bottomnav .ico.panes::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1.5px solid currentColor; }
.bottomnav .ico.convs { border-radius: 8px 8px 8px 2px; }
.bottomnav .ico.mach { height: 14px; box-shadow: 0 5px 0 -3.5px currentColor; }
.bottomnav .ico.more { border: none; display: flex; gap: 3px; align-items: center; justify-content: center; }
.bottomnav .ico.more i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.bottomnav .badge { position: absolute; top: 6px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: var(--amber); color: #1d1500; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }

/* ---------- lamps: shape + colour ---------- */
.lamp { display: inline-block; flex: none; width: 12px; height: 12px; vertical-align: middle; }
.lamp-ask { background: var(--amber); transform: rotate(45deg) scale(.86); border-radius: 2px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--amber) 35%, transparent), 0 0 12px var(--amber); }
.lamp-wait { background: var(--amber); border-radius: 2px; transform: rotate(45deg) scale(.86); box-shadow: 0 0 0 2px color-mix(in srgb, var(--amber) 25%, transparent); opacity: .8; }
.lamp-drive { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--amber); }
.lamp-work { background: var(--teal); border-radius: 50%; box-shadow: 0 0 0 2px color-mix(in srgb, var(--teal) 30%, transparent), 0 0 10px var(--teal); animation: breathe 2.4s ease-in-out infinite; }
.lamp-fail { background: var(--red); border-radius: 1px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 30%, transparent), 0 0 8px var(--red); }
.lamp-done { border: 2px solid var(--unlit); border-radius: 50%; }
.lamp-idle { background: var(--unlit); border-radius: 50%; opacity: .6; }
.lamp-arch { border: 2px dashed var(--unlit); border-radius: 50%; }
.lamp-off { background: var(--unlit); border-radius: 50%; opacity: .35; }
@keyframes breathe { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 15%, transparent), 0 0 4px var(--teal); } }
.state { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: .93em; white-space: nowrap; }
.state.ask, .state.wait, .state.drive { color: var(--amber-ink); }
.state.work { color: color-mix(in srgb, var(--teal) 70%, var(--ink)); }
.state.fail { color: var(--red); }
.state.done, .state.idle, .state.arch { color: var(--ink-3); font-weight: 500; }

/* ---------- glass (pane) ---------- */
.glass { background: var(--glass); color: var(--glass-ink); font-family: var(--mono); font-size: 12px; line-height: 1.5; border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 2px 10px rgba(0,0,0,.5); padding: 9px 11px; overflow: hidden; }
.glass .l { white-space: pre-wrap; word-break: break-word; }
.glass .dim { color: var(--glass-dim); }
.glass .ok { color: #7fd1a8; }
.glass .warn { color: #f0b84a; }
.glass .err { color: #ff8a7a; }
.glass .cur::after { content: "▍"; color: var(--glass-ink); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cmd { background: var(--glass); color: var(--glass-ink); font-family: var(--mono); font-size: 12.5px; line-height: 1.5; padding: 9px 11px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; box-shadow: inset 0 0 0 1px var(--glass-edge); margin: 0; }

/* ---------- buttons and controls ---------- */
.btn { min-height: 34px; padding: 6px 14px; border-radius: 5px; border: 1px solid var(--edge); background: var(--metal-hi); cursor: pointer; font-weight: 600; color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 1px 1px rgba(0,0,0,.08); }
.phone-app .btn { min-height: 44px; padding: 8px 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.go { background: var(--go); color: var(--go-ink); border-color: var(--go); }
.btn.quiet { background: transparent; box-shadow: none; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 55%, var(--edge)); }
.btn.danger.solid { background: var(--red); color: #fff; border-color: var(--red); }
.btn.sm { min-height: 28px; padding: 3px 10px; font-size: 13px; }
.phone-app .btn.sm { min-height: 44px; padding: 6px 14px; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; gap: 4px; align-content: start; }
.field label, .field .lab { font-weight: 600; font-size: 13px; }
.field .help { font-size: 12.5px; color: var(--ink-2); }
.input { border: 1px solid var(--edge); background: var(--metal-hi); border-radius: 5px; padding: 7px 9px; min-height: 36px; width: 100%; box-shadow: inset 0 1px 2px rgba(0,0,0,.1); }
.phone-app .input { min-height: 44px; font-size: 16px; }
.input.mono { font-family: var(--mono); font-size: 13px; }
.alert { color: var(--red); font-weight: 600; font-size: 13px; }
.okmsg { color: color-mix(in srgb, var(--teal) 70%, var(--ink)); font-weight: 600; font-size: 13px; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }

/* toggle switch, physical */
.tog { display: flex; align-items: center; gap: 12px; padding: 6px 0; cursor: pointer; }
.tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tog .sw { flex: none; width: 40px; height: 22px; border-radius: 4px; background: var(--metal-2); border: 1px solid var(--edge); position: relative; box-shadow: inset 0 1px 3px rgba(0,0,0,.2); }
.tog .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 3px; background: var(--metal-hi); border: 1px solid var(--edge); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
.tog .sw::before { content: ""; position: absolute; right: 6px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--unlit); opacity: .5; }
.tog input:checked + .sw::after { left: 20px; }
.tog input:checked + .sw::before { left: 7px; right: auto; background: var(--teal); opacity: 1; box-shadow: 0 0 6px var(--teal); }
.tog input:focus-visible + .sw { outline: 2px solid var(--focus); outline-offset: 2px; }
.phone-app .tog { min-height: 44px; }

/* segmented (rotary) */
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 5px; overflow: hidden; background: var(--metal-2); flex-wrap: wrap; }
.seg button { border: none; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; min-height: 32px; }
.phone-app .seg button { min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--metal-hi); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--edge); }

/* ---------- decision card (one anatomy for offers, prompts, failures) ---------- */
.decision { background: var(--metal-hi); border: 1px solid var(--edge); border-radius: 6px; padding: 12px 14px; display: grid; gap: 9px; align-content: start; position: relative; min-width: 0; }
.decision.lit { border-color: color-mix(in srgb, var(--amber) 70%, var(--edge)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--amber) 40%, transparent), 0 0 18px color-mix(in srgb, var(--amber) 22%, transparent); }
.decision.failed { border-color: color-mix(in srgb, var(--red) 60%, var(--edge)); }
.decision.resolved { box-shadow: none; border-color: var(--edge); opacity: .92; }
.decision .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.decision .who .state { font-size: 13px; }
.decision .title { font-weight: 600; font-size: 15px; }
.decision .q { font-size: 14px; }
.decision .meta { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; }
.decision .expiry { font-family: var(--mono); color: var(--amber-ink); font-weight: 500; }
.decision .opts { display: grid; gap: 6px; }
.decision .opt { text-align: left; border: 1px solid var(--edge); background: var(--metal); border-radius: 5px; padding: 8px 10px; cursor: pointer; font-weight: 500; min-height: 38px; }
.phone-app .decision .opt { min-height: 44px; }
.decision .opt b { font-family: var(--mono); margin-right: 6px; }
.decision .result { font-weight: 600; display: flex; gap: 8px; align-items: center; }
details.raw summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
details.raw pre { margin: 6px 0 0; }
.reply { display: flex; gap: 6px; }
.reply .input { flex: 1; min-width: 0; }
</style>
<style>
/* ---------- pane wall ---------- */
.wall { padding: 16px 18px 22px; display: grid; gap: 18px; }
.phone-app .wall { padding: 12px 12px 20px; gap: 14px; }
.strip-head { display: flex; align-items: baseline; gap: 10px; }
.strip-head h2 { display: flex; align-items: center; gap: 9px; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.phone-app .strip { display: flex; align-items: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; margin: 0 -12px; padding: 2px 12px 8px; }
.phone-app .strip > .decision { flex: 0 0 316px; scroll-snap-align: start; }
.phone-app .strip-head { flex-direction: column; align-items: flex-start; gap: 2px; }
.older { border: 1px dashed var(--edge); border-radius: 6px; padding: 8px 12px; }
.older summary { cursor: pointer; font-weight: 600; color: var(--ink-2); min-height: 30px; display: flex; align-items: center; gap: 8px; }
.phone-app .older summary { min-height: 44px; }
.older .decision { margin-top: 8px; }
.racks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.phone-app .racks { grid-template-columns: 1fr; }
.rack { display: grid; gap: 10px; }
.rack-head { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--edge); }
.rack-head h3 { font-size: 15px; }
.rack-head .dest { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-left: auto; }
.tile { border: 1px solid var(--edge); border-radius: 6px; background: var(--metal-hi); padding: 9px; display: grid; gap: 8px; cursor: pointer; text-align: left; width: 100%; color: var(--ink); }
.tile:hover { border-color: var(--ink-3); }
.tile.lit { border-color: color-mix(in srgb, var(--amber) 70%, var(--edge)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--amber) 35%, transparent), 0 0 16px color-mix(in srgb, var(--amber) 18%, transparent); }
.tile.failed { border-color: color-mix(in srgb, var(--red) 55%, var(--edge)); }
.tile.dim { opacity: .62; }
.tile .th { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tile .th .ws { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .th .ag { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.tile .th .el { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile .glass { height: 92px; display: flex; flex-direction: column; justify-content: flex-end; }
.tile .tf { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; min-width: 0; }
.tile .tf .conv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); min-width: 0; }
.tile .noglass { font-size: 13px; color: var(--ink-2); padding: 4px 2px; }
.snoozed { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }

/* ---------- conversation ---------- */
.conv-desk { display: grid; grid-template-columns: minmax(0, 1fr) 520px; height: 100%; min-height: 0; }
.pane-side { display: flex; flex-direction: column; min-height: 0; padding: 12px 0 12px 14px; gap: 10px; }
.tabs { display: flex; gap: 2px; font-family: var(--mono); font-size: 12px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--edge); border-bottom: none; background: var(--metal-2); padding: 6px 10px; border-radius: 5px 5px 0 0; cursor: pointer; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.phone-app .tabs button { min-height: 40px; }
.phone-app .tabs { flex-wrap: nowrap; overflow-x: auto; font-size: 11.5px; }
.phone-app .tabs button { white-space: nowrap; flex: none; }
.tabs button[aria-selected="true"] { background: var(--glass); color: var(--glass-ink); border-color: var(--glass); }
.bigpane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; border-top-left-radius: 0; }
.bigpane .lines { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }

  stage.querySelectorAll(".log").forEach((el) => { if (S.stickLog) el.scrollTop = el.scrollHeight; });
  S.stickLog = false;
  stage.querySelectorAll("textarea").forEach(autosize);
  stage.querySelectorAll(".bigpane").forEach((el) => { el.scrollTop = el.scrollHeight; });
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } } }
  toolbar();
}
function fit() {
  const ds = stage.querySelector(".desk-shell");
  if (ds) { const w = Math.min(ds.clientWidth, 1280); const s = w / 1280; const sc = ds.querySelector(".desk-scaler"); sc.style.transform = `scale(${s})`; ds.querySelector(".desk-wrap").style.height = 820 * s + "px"; }
  const ps = stage.querySelector(".phone-shell");
  if (ps) { const w = Math.min(ps.clientWidth, 414); const s = Math.min(1, w / 414); const sc = ps.querySelector(".phone-scaler"); sc.style.transform = `scale(${s})`; ps.querySelector(".phone-wrap").style.height = 868 * s + "px"; }
}
function autosize(t) { t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight + 2) + "px"; }
window.addEventListener("resize", fit);

/* toolbar */
function store(k, v) { try { localStorage.setItem("patchbay." + k, v); } catch (e) { /* storage unavailable */ } }
function load(k) { try { return localStorage.getItem("patchbay." + k); } catch (e) { return null; } }
function toolbar() {
  const mk = (gid, items, cur, act) => { const g = document.getElementById(gid); g.querySelectorAll("button").forEach((b) => b.remove());
    items.forEach(([v, l]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = l; b.dataset.tb = act; b.dataset.v = v; b.setAttribute("aria-pressed", String(cur === v)); g.appendChild(b); }); };
  const scr = { list: "inbox", settings: "vault" }[S.screen] || S.screen;
  mk("tb-screen", [["inbox", "Inbox (pane wall)"], ["conversation", "Conversation"], ["machines", "Machines"], ["vault", "Vault"], ["login", "Login"]], scr, "screen");
  mk("tb-frame", [["phone", "Phone"], ["desktop", "Desktop"], ["both", "Both"]], S.frame, "frame");
  mk("tb-theme", [["system", "System"], ["light", "Light"], ["dark", "Dark"]], S.theme, "theme");
  const sg = document.getElementById("tb-scn"); sg.hidden = S.screen !== "conversation";
  mk("tb-scn", [["offer", "Offer waiting"], ["working", "Turn running"], ["asking", "Agent asking"]], S.conv.blank ? "" : S.scn, "scn");
}
function applyTheme() { if (S.theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme); }
document.querySelector(".proto").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tb]"); if (!b) return; const v = b.dataset.v;
  S.stickLog = true;
  if (b.dataset.tb === "screen") { S.screen = v; S.moreOpen = false; S.flash = {}; store("screen", v); }
  if (b.dataset.tb === "frame") { S.frame = v; store("frame", v); }
  if (b.dataset.tb === "theme") { S.theme = v; store("theme", v); applyTheme(); }
  if (b.dataset.tb === "scn") { S.scn = v; S.conv = newConv(v); store("scn", v); }
  render();
});

/* ================= turns ================= */
function startTurn(t) { const c = S.conv; c.turn = Object.assign({ stages: ["Queued", "Deciding where this goes"], started: Date.now(), cancelling: false, task: "t-cc" }, t); c.cancelled = false; if (!c.tasks.includes(c.turn.task)) c.tasks.push(c.turn.task); c.tab = c.turn.task; livePos[c.turn.task] = 0; S.stickLog = true; }
function endTurn(html) {
  const c = S.conv; c.turn = null; if (html) c.extra.push({ html });
  if (c.held) { const m = c.held; c.held = ""; sendText(m); }
  S.stickLog = true; render();
}
function now() { return new Date().toTimeString().slice(0, 5); }
function sendText(m) {
  const c = S.conv; c.blank = false;
  c.extra.push({ html: entry("you", now(), esc(m), "you") });
  startTurn({ label: "Deciding where this goes", stages: ["Queued"], finishAt: Date.now() + 9000 });
  setTimeout(() => { if (c.turn && c.turn.label === "Deciding where this goes") { c.turn.stages = ["Queued", "Deciding where this goes"]; c.turn.label = "claude-code is working in ledger-api"; render(); } }, 2200);
}

/* ================= events ================= */
function frameOf(el) { return el.closest(".phone") ? "p" : "d"; }
stage.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, ctx = b.dataset.ctx; const c = S.conv; const t = tgt(S.machSel);
  if (a === "more-close" && e.target !== b) return;
  switch (a) {
    case "nav": S.screen = v; S.moreOpen = false; S.flash = {}; S.machForm = null; break;
    case "more": S.moreOpen = true; break;
    case "more-close": S.moreOpen = false; break;
    case "go-conv": S.screen = "conversation"; S.flash = {}; S.stickLog = true; break;
    case "new-conv": S.conv = newConv("offer"); Object.assign(S.conv, { blank: true, offer: null, tasks: [], tab: null }); S.screen = "conversation"; break;
    case "logout": S.screen = "login"; S.moreOpen = false; S.loginErr = ""; break;
    case "offer-approve":
      if (ctx === "wall") { S.needs.offer.status = "approved"; S.flash.offerWall = true; }
      else { c.offer.status = "approved"; c.extra.push({ html: entry("you", now(), "yes", "you") }); startTurn({ label: "Running a command in infra-terraform", task: "t-kx", kind: "kx" }); paneLines["t-kx"] = PANE["t-kx"].slice(); }
      break;
    case "offer-deny":
      if (ctx === "wall") { S.needs.offer.status = "denied"; S.flash.offerWall = true; }
      else { c.offer.status = "denied"; c.extra.push({ html: entry("you", now(), "no", "you") }); S.stickLog = true; }
      break;
    case "prompt-answer": answerPrompt(ctx, v); break;
    case "failed-retry": S.needs.failed.status = "retried"; S.flash.failedWall = true; break;
    case "older-snooze": S.needs.older.snoozed = true; break;
    case "older-unsnooze": S.needs.older.snoozed = false; break;
    case "cancel-turn": c.turn.cancelling = true; setTimeout(() => { if (S.conv === c && c.turn) { c.turn = null; c.cancelled = true; S.stickLog = true; render(); } }, 1300); break;
    case "retry-cancelled": c.cancelled = false; startTurn({ label: "claude-code is working in ledger-api" }); break;
    case "unhold": S.inputs.draft = c.held; c.held = ""; break;
    case "tab": c.tab = v; break;
    case "transcript": c.showTranscript = !c.showTranscript; break;
    case "copy": copy(b); return;
    case "conv-filter": S.inputs.convFilter = v; break;
    case "mach-sel": S.machSel = v; S.scan = null; S.test = null; S.wsConfirm = null; S.tgtConfirm = false; S.machForm = null; S.flash = {}; break;
    case "mach-jump": S.screen = "machines"; S.machSel = v; S.machForm = null; S.flash = {}; break;
    case "tf-new": S.machForm = { edit: null, kind: "remote" }; ["name", "host", "user", "port", "root", "perm", "agents"].forEach((k) => delete S.inputs["tf-" + k]); S.flash = {}; break;
    case "tf-edit": S.machForm = { edit: t.id, kind: t.kind }; Object.assign(S.inputs, { "tf-name": t.name, "tf-host": t.host, "tf-user": t.user, "tf-port": t.port ? String(t.port) : "", "tf-root": "", "tf-perm": t.permission, "tf-agents": t.agents }); S.flash = {}; break;
    case "tf-kind": S.machForm.kind = v; break;
    case "tf-cancel": S.machForm = null; S.flash = {}; break;
    case "scan": S.scan = { t: t.id, expires: Date.now() + 598000 }; S.flash = {}; break;
    case "pin": { const k = SCAN_KEYS.find((x) => x.type === v); t.pinned = [{ type: k.type, fp: k.fp }]; S.scan = null; S.flash = { machSaved: `Pinned the ${k.type} key for ${t.name}.` }; break; }
    case "unpin": t.pinned = []; S.flash = { machSaved: `Unpinned ${t.name}'s host key.` }; break;
    case "test": S.test = "running"; setTimeout(() => { S.test = { t: t.id }; render(); }, 1400); break;
    case "probe": t.health.probed = "just now"; break;
    case "purpose": snap(t); t.purpose = v; break;
    case "mach-save": delete S.machDirty[t.id]; delete S.machSnap[t.id]; S.flash = { machSaved: `Saved ${t.name}.` }; break;
    case "mach-discard": Object.assign(t, S.machSnap[t.id]); delete S.machDirty[t.id]; delete S.machSnap[t.id]; break;
    case "ws-status": WORKSPACES.find((w) => w.id === v).status = b.dataset.s; if (b.dataset.s === "idle") delete WORKSPACES.find((w) => w.id === v).reason; break;
    case "ws-del": S.wsConfirm = v; break;
    case "ws-del-no": S.wsConfirm = null; break;
    case "ws-del-yes": { const i = WORKSPACES.findIndex((w) => w.id === v); const w = WORKSPACES[i]; WORKSPACES.splice(i, 1); S.wsConfirm = null; S.flash = { wsDeleted: `Deleted ${w.name}. Its files on ${tgt(w.target).name} are kept.` }; break; }
    case "tgt-del": S.tgtConfirm = true; break;
    case "tgt-del-no": S.tgtConfirm = false; break;
    case "tgt-del-yes": TARGETS.splice(TARGETS.indexOf(t), 1); S.machSel = TARGETS[0].id; S.tgtConfirm = false; break;
    case "cred-add": S.vaultAdd = true; S.flash = {}; break;
    case "cred-add-cancel": S.vaultAdd = false; S.flash = {}; ["cn", "cw", "ca"].forEach((k) => delete S.inputs[k]); break;
    case "cred-replace": S.vaultReplace = v; S.vaultDelete = null; S.flash = {}; break;
    case "cred-replace-cancel": S.vaultReplace = null; break;
    case "cred-del": S.vaultDelete = v; S.vaultReplace = null; S.flash = {}; break;
    case "cred-del-no": S.vaultDelete = null; break;
    case "cred-del-yes": { const i = CREDS.findIndex((x) => x.id === v); S.flash = { cred: `Deleted ${CREDS[i].name}.` }; CREDS.splice(i, 1); S.vaultDelete = null; break; }
    case "revoke": { const i = S.sessions.findIndex((x) => x.id === v); S.flash = { dev: `Logged out ${S.sessions[i].label}.` }; S.sessions.splice(i, 1); break; }
    default: return;
  }
  render();
});
S.machSnap = {};
function snap(t) { if (!S.machSnap[t.id]) S.machSnap[t.id] = { purpose: t.purpose, relay: t.relay, allowProvision: t.allowProvision, allowShell: t.allowShell, ask: t.ask }; S.machDirty[t.id] = true; S.flash = {}; }
function answerPrompt(ctx, ans) {
  if (ctx === "wall") { S.needs.prompt.status = "answered"; S.needs.prompt.answer = ans; S.flash.promptWall = true; return; }
  const c = S.conv; c.prompt.status = "answered"; c.prompt.answer = ans;
  c.extra.push({ html: entry("you", now(), esc(ans), "you") });
  startTurn({ label: "claude-code is working in ledger-api", finishAt: Date.now() + 10000 });
}
function copy(b) {
  const el = document.getElementById(b.dataset.target); if (!el) return; const key = "copy-" + b.dataset.target;
  const done = (msg) => { S.flash[key] = msg; render(); setTimeout(() => { delete S.flash[key]; render(); }, 2000); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected: press Ctrl+C"; };
  try { navigator.clipboard.writeText(el.textContent).then(() => done("Copied"), fallback); } catch (err) { fallback(); }
}
stage.addEventListener("change", (e) => {
  const el = e.target; const t = tgt(S.machSel);
  if (el.dataset.tog) { snap(t); t[el.dataset.tog] = el.checked; render(); }
  else if (el.dataset.relay != null) { snap(t); t.relay = el.dataset.relay; render(); }
  else if (el.tagName === "SELECT" && el.dataset.in) { S.inputs[el.dataset.in] = el.value; }
});
const RERENDER = new Set(["draft", "pw"]);
const SECRET = new Set(["cv", "rv"]);
stage.addEventListener("input", (e) => {
  const el = e.target; const k = el.dataset.in; if (!k || SECRET.has(k)) return;
  S.inputs[k] = el.value;
  if (el.tagName === "TEXTAREA") autosize(el);
  if (RERENDER.has(k)) render();
});
stage.addEventListener("toggle", (e) => { const d = e.target; if (d.dataset && d.dataset.det) S.inputs[d.dataset.det] = d.open; }, true);
stage.addEventListener("keydown", (e) => {
  if (e.target.dataset && e.target.dataset.in === "draft" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.target.form.requestSubmit(); }
});
stage.addEventListener("submit", (e) => {
  e.preventDefault(); const f = e.target; const kind = f.dataset.form; const fp = frameOf(f); const c = S.conv;
  if (kind === "send") {
    const m = (S.inputs.draft || "").trim(); if (!m) return;
    S.inputs.draft = "";
    if (c.turn) c.held = m; else sendText(m);
  } else if (kind === "prompt-reply") {
    const k = f.dataset.ctx + "-promptReply"; const m = (S.inputs[k] || "").trim(); if (!m) return; S.inputs[k] = ""; answerPrompt(f.dataset.ctx, m);
  } else if (kind === "login") {
    if ((S.inputs.pw || "") === "loom") { S.loginErr = ""; S.inputs.pw = ""; S.screen = "conversation"; S.scn = "offer"; S.conv = newConv("offer"); }
    else { S.loginErr = "Invalid password. Check it and try again."; S.inputs.pw = ""; }
  } else if (kind === "target") {
    const g = (k) => (S.inputs["tf-" + k] || "").trim(); const kindv = S.machForm.kind;
    if (!g("name")) { S.flash.tfErr = "Give the target a name."; render(); return; }
    if (kindv === "remote" && (!g("host") || !g("user"))) { S.flash.tfErr = "Host and user are required for a remote target."; render(); return; }
    if (g("port") && !/^\d+$/.test(g("port"))) { S.flash.tfErr = "The SSH port must be a number, or empty."; render(); return; }
    if (g("root") && (!g("root").startsWith("/") || g("root") === "/")) { S.flash.tfErr = "The workspace root must be an absolute path other than /."; render(); return; }
    if (S.machForm.edit) { const t = tgt(S.machForm.edit); Object.assign(t, { name: g("name"), host: g("host"), user: g("user"), port: Number(g("port")) || 22, permission: S.inputs["tf-perm"] || "", agents: g("agents") }); S.flash = { machSaved: `Saved ${t.name}.` }; }
    else { const nt = { id: "t" + Date.now(), name: g("name"), kind: kindv, user: g("user"), host: g("host"), port: Number(g("port")) || 22, purpose: "personal", relay: "", permission: S.inputs["tf-perm"] || "", agents: g("agents"), allowProvision: true, allowShell: true, ask: false, pinned: kindv === "remote" ? [] : null, health: { reachable: true, latency: 52, tmux: "3.5a", disk: "130 GB", probed: "just now" } };
      TARGETS.push(nt); S.machSel = nt.id; S.flash = { machSaved: `Registered ${nt.name}. Next, scan and pin its host key.` }; }
    S.machForm = null;
  } else if (kind === "cred-add") {
    const name = (S.inputs.cn || "").trim(); const vEl = document.getElementById(fp + "-cv"); const value = vEl ? vEl.value : "";
    if (vEl) vEl.value = "";
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) { S.flash.credErr = "The name becomes an environment variable: letters, digits and _, not starting with a digit."; render(); return; }
    if (/^(PATH|HOME|SHELL|USER|LOOMUX_.*)$/.test(name)) { S.flash.credErr = "That name is used by the shell or by Loomux itself. Pick another."; render(); return; }
    if (!value) { S.flash.credErr = "Type the value to store."; render(); return; }
    const ws = S.inputs.cw || ""; const ag = (S.inputs.ca || "").trim();
    if (CREDS.some((x) => x.name === name && x.ws === ws && x.agent === ag)) { S.flash.credErr = `${name} already exists at this scope. Use Replace value on it instead.`; render(); return; }
    CREDS.push({ id: "c" + Date.now(), name, ws, agent: ag, updated: "just now" });
    ["cn", "cw", "ca"].forEach((k) => delete S.inputs[k]); S.vaultAdd = false; S.flash = { cred: `Saved ${name}. Its value can't be shown again.` };
  } else if (kind === "cred-replace") {
    const vEl = document.getElementById(fp + "-rv"); const value = vEl ? vEl.value : ""; if (vEl) vEl.value = "";
    if (!value) return;
    const cr = CREDS.find((x) => x.id === f.dataset.v); cr.updated = "just now"; S.vaultReplace = null; S.flash = { cred: `Replaced the value of ${cr.name}.` };
  }
  S.stickLog = true; render();
});

/* ================= clocks and live panes ================= */
setInterval(() => {
  const n = Date.now(); let need = false;
  document.querySelectorAll("[data-elapsed]").forEach((el) => { el.textContent = fmtDur(n - Number(el.dataset.elapsed)); });
  document.querySelectorAll("[data-expires]").forEach((el) => { const left = Number(el.dataset.expires) - n; el.textContent = fmtLeft(left); });
  if (S.needs.offer.status === "pending" && S.needs.offer.expires <= n) { S.needs.offer.status = "expired"; S.flash.offerWall = true; need = true; }
  if (S.conv.offer && S.conv.offer.status === "pending" && S.conv.offer.expires <= n) { S.conv.offer.status = "expired"; need = true; }
  document.querySelectorAll("[data-scan-exp]").forEach((el) => { el.textContent = fmtLeft(Number(el.dataset.scanExp) - n); });
  if (S.scan && S.scan.expires <= n) { S.scan = null; need = true; }
  document.querySelectorAll("[data-clock]").forEach((el) => { el.textContent = clock(); });
  const c = S.conv; if (c.turn && c.turn.finishAt && c.turn.finishAt <= n) {
    endTurn(entry("claude-code", now(), `<p>Done. <code>LEDGER_RATE_LIMIT</code> now sets the per-key limit (default 20), and keys are trimmed before bucketing. 5 tests pass.</p>`)); return;
  }
  if (need) render();
}, 1000);
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
setInterval(() => {
  const c = S.conv; const active = ["t-blog"];
  if (c.turn) active.push(c.turn.task); else if (c.scn === "working" && !c.cancelled) active.push("t-cc");
  active.forEach((tid) => {
    const src = LIVE[tid]; if (!src) return;
    if (livePos[tid] >= src.length) {
      if (tid === "t-kx" && c.turn && c.turn.task === "t-kx") { endTurn(entry("loomux", now(), `<p>Ran in infra-terraform on kestrel:</p><pre class="cmd">$ kubectl -n staging rollout restart deploy/ledger-api
deployment.apps/ledger-api restarted
deployment "ledger-api" successfully rolled out
exit 0</pre>`)); return; }
      if (tid === "t-kx") return;
      livePos[tid] = 0;
    }
    paneLines[tid].push(src[livePos[tid]++]);
    if (paneLines[tid].length > 80) paneLines[tid].splice(0, paneLines[tid].length - 80);
    document.querySelectorAll(`[data-pane="${tid}"]`).forEach((el) => { el.innerHTML = paneHTML(tid, el.dataset.n ? Number(el.dataset.n) : 200); const gp = el.closest(".bigpane"); if (gp) gp.scrollTop = gp.scrollHeight; });
  });
}, reduce ? 3000 : 1150);

/* ================= boot ================= */
S.frame = load("frame") || (window.innerWidth < 900 ? "phone" : "both");
S.theme = load("theme") || "system";
S.screen = load("screen") || "inbox";
S.scn = load("scn") || "offer"; S.conv = newConv(S.scn);
S.stickLog = true; applyTheme(); render();
})();
</script>
